<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>iTodo</title>
<meta name="theme-color" content="#4f6ef7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办助手">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    /* iOS 系统色 */
    --bg: #f2f2f7;
    --card: #ffffff;
    --line: #e5e5ea;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --accent: #007aff;
    --accent-2: #3395ff;
    --accent-soft: rgba(0, 122, 255, .1);
    --high: #ff3b30; --mid: #ff9500; --low: #34c759;
    --wx: #07c160; --qq: #12b7f5; --manual: #98989f;
    --fill: #e9e9eb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .08);
    --glass: rgba(255, 255, 255, .72);
    /* iOS 动效缓动曲线 */
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);   /* 弹簧回弹 */
    --ease-smooth: cubic-bezier(.25, .1, .25, 1);      /* 平滑减速 */
    --ease-out: cubic-bezier(0, 0, .2, 1);             /* 苹果标准 out */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --line: #38383a;
      --text: #ffffff;
      --muted: #98989f;
      --accent: #0a84ff;
      --accent-2: #409cff;
      --accent-soft: rgba(10, 132, 255, .22);
      --fill: #2c2c2e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .6);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, .6);
      --glass: rgba(28, 28, 30, .72);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 110px; }

  /* ── Hero:毛玻璃大标题(iOS Large Title)── */
  header { position: sticky; top: 0; z-index: 30; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); margin: 0 -16px 16px; padding: 14px 18px 12px; border-bottom: .5px solid var(--line); }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
  .hero .date { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .hero .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hero .conns { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 11px; border-radius: 999px; font-size: 11.5px; background: var(--fill); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .chip .light { width: 7px; height: 7px; border-radius: 50%; background: #c7c7cc; }
  .chip.ok .light { background: #34c759; }
  .stats { font-size: 12.5px; color: var(--muted); }
  .stats b { color: var(--text); font-size: 14px; margin: 0 2px; }
  .stats b.hot { color: var(--high); }
  .mini-btn { border: none; background: var(--fill); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 600; transition: opacity .15s; }
  .mini-btn:hover { opacity: .7; }
  .mini-btn:active { opacity: .5; }

  /* ── 卡片:分组圆角(iOS Grouped)── */
  .card {
    background: var(--card);
    border: none;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    animation: fadeUp .5s var(--ease-spring) both;
  }
  .h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 6px 10px; letter-spacing: .3px; }
  summary.h2 { cursor: pointer; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; background: var(--fill); padding: 2px; border-radius: 10px; }
  .tab { border: none; background: transparent; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); transition: all .25s var(--ease-smooth); }
  .tab.on { background: var(--card); font-weight: 600; box-shadow: var(--shadow); animation: popIn .3s var(--ease-spring); }
  .search { flex: 1; min-width: 140px; padding: 10px 14px; border: none; border-radius: 12px; font-size: 14px; outline: none; background: var(--fill); color: var(--text); transition: all .2s var(--ease-smooth); }
  .search:focus { background: var(--card); box-shadow: 0 0 0 2px var(--accent); transform: scale(1.005); }

  .btn {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: transform .25s var(--ease-spring), opacity .15s;
    will-change: transform;
  }
  .btn:hover { opacity: .88; }
  .btn:active { transform: scale(.93); opacity: .75; }
  .mini-btn:active { transform: scale(.92); }

  /* ── 总览 ── */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--card); border-radius: 18px; padding: 16px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat-card .num { font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: -.5px; }
  .stat-card .lbl { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .feat { background: var(--card); border-radius: 18px; padding: 16px 13px; cursor: pointer; transition: transform .3s var(--ease-spring), box-shadow .25s var(--ease-smooth); position: relative; display: block; box-shadow: var(--shadow); will-change: transform; }
  .feat:hover { transform: translateY(-3px) scale(1.015); box-shadow: var(--shadow-lg); }
  .feat:active { transform: scale(.94); transition-duration: .12s; }
  .feat .icon { font-size: 25px; }
  .feat .name { font-size: 14px; font-weight: 600; margin-top: 9px; }
  .feat .desc { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; word-break: break-all; }
  .feat .cmd { font-size: 10.5px; color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 2px 8px; margin-top: 8px; display: inline-block; font-weight: 600; }
  .tl { list-style: none; }
  .tl li { display: flex; align-items: center; gap: 10px; padding: 10px 6px; font-size: 14px; border-radius: 10px; }
  .tl .t { font-weight: 600; color: var(--accent); min-width: 96px; }
  .weather-box { position: relative; overflow: hidden; color: #fff; border-radius: 20px; padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow-lg); animation: fadeUp .4s cubic-bezier(.25,.1,.25,1) both; transition: background .6s ease; }
  .weather-box.w-sun { background: linear-gradient(160deg, #2f8fff 0%, #5fb4ff 100%); }
  .weather-box.w-cloud { background: linear-gradient(160deg, #5d7fa6 0%, #8fa8c7 100%); }
  .weather-box.w-overcast { background: linear-gradient(160deg, #6d7d92 0%, #9aa8bb 100%); }
  .weather-box.w-fog { background: linear-gradient(160deg, #8494a8 0%, #b6c2d0 100%); }
  .weather-box.w-rain { background: linear-gradient(160deg, #33435f 0%, #55688a 100%); }
  .weather-box.w-snow { background: linear-gradient(160deg, #6f9cc4 0%, #c3dcef 100%); }
  .weather-box.w-storm { background: linear-gradient(160deg, #252c44 0%, #434d6e 100%); }
  .weather-box .w-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .weather-box .w-icon { font-size: 34px; line-height: 1; animation: wfloat 3s ease-in-out infinite; }
  .weather-box.w-sun .w-icon { animation: wpulse 2.5s ease-in-out infinite; }
  .weather-box .w-cond { font-size: 15px; font-weight: 700; }
  .weather-box .w-lines { font-size: 13.5px; line-height: 1.95; opacity: .97; white-space: pre-line; }
  .weather-box.w-rain::after, .weather-box.w-storm::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(transparent 0%, rgba(255,255,255,.14) 100%);
    background-size: 100% 28px;
    animation: wrain 1.2s linear infinite;
    opacity: .5;
  }
  @keyframes wfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes wpulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,220,100,.8)); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(255,220,100,1)); } }
  @keyframes wrain { from { background-position: 0 -28px; } to { background-position: 0 0; } }
  .tom-cls { display: flex; align-items: center; gap: 10px; padding: 9px 6px; font-size: 14px; border-radius: 10px; }
  .tom-cls .tm { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .cd-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 6px; font-size: 14px; border-radius: 10px; }
  .cd-item .d { font-weight: 700; color: var(--high); white-space: nowrap; }
  .cheat { font-size: 13px; line-height: 2; color: var(--text); }
  .cheat code { background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 6px; font-size: 12px; }

  /* ── 设置列表(iOS Grouped List)── */
  .set-row { display: flex; align-items: center; gap: 12px; padding: 13px 8px; border-bottom: .5px solid var(--line); cursor: pointer; transition: background .15s; }
  .set-row:last-child { border-bottom: none; }
  .set-row:active { background: var(--fill); }
  .set-row .sicon { font-size: 21px; width: 28px; text-align: center; }
  .set-row .sname { flex: 1; font-size: 15px; }
  .set-row .sval { font-size: 13px; color: var(--muted); text-align: right; max-width: 46%; word-break: break-all; }
  .set-row .arrow { color: #c7c7cc; font-size: 17px; }

  /* ── 顶部/底部导航 ── */
  .vtabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .vtabs::-webkit-scrollbar { display: none; }
  .vtab { border: none; background: var(--fill); padding: 9px 18px; border-radius: 999px; cursor: pointer; font-size: 13.5px; color: var(--text); white-space: nowrap; transition: all .2s; position: relative; }
  .vtab.on { background: var(--accent); color: #fff; font-weight: 600; }
  .vtab .chdot { position: absolute; top: 1px; right: 6px; background: #ff3b30; color: #fff; font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; line-height: 15px; text-align: center; padding: 0 4px; border-radius: 8px; box-sizing: border-box; }

  /* ── 聊天 ── */
  .chat-msgs { display: flex; flex-direction: column; gap: 8px; padding: 8px 2px; min-height: 180px; max-height: 56vh; overflow-y: auto; }
  .chat-msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
  .chat-msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .chat-msg.you { align-self: flex-start; background: var(--fill); color: var(--text); border-bottom-left-radius: 5px; }
  .chat-msg .cm-time { display: block; font-size: 10.5px; opacity: .65; margin-top: 3px; }
  .chat-row { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: .5px solid var(--line); cursor: pointer; }
  .chat-row:last-child { border-bottom: none; }
  .chat-row .cavatar { width: 38px; height: 38px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
  .chat-row .cmain { flex: 1; min-width: 0; }
  .chat-row .cname { font-weight: 600; font-size: 14.5px; }
  .chat-row .clast { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-row .cunread { background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 9px; padding: 0 5px; box-sizing: border-box; }

  /* ── 留言回复 ── */
  .replies-box { margin-top: 10px; padding-left: 11px; border-left: 2px solid var(--line); }
  .reply { margin: 7px 0; font-size: 13.5px; line-height: 1.5; }
  .reply .rname { font-weight: 600; }
  .reply .rtime { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .reply .rdel { border: none; background: transparent; color: #c7c7cc; cursor: pointer; font-size: 12px; margin-left: 6px; }
  .replybar { display: flex; gap: 8px; margin-top: 9px; }
  .replybar input { flex: 1; min-width: 0; }

  /* ── 课表 ── */
  .s-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .s-head .who { font-size: 15px; }
  .s-head .sub { font-size: 12px; color: var(--muted); }
  .s-day { margin-bottom: 12px; }
  .s-dayname { font-size: 12.5px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .s-item { display: flex; align-items: center; gap: 10px; padding: 9px 6px; font-size: 14px; border-radius: 10px; }
  .s-item .t { flex: 1; min-width: 0; word-break: break-all; }
  .s-week { font-size: 11px; color: var(--muted); background: var(--fill); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .card.pre { white-space: pre-line; }
  .s-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

  /* ── 待办 ── */
  .list { list-style: none; }
  form.add { display: grid; grid-template-columns: minmax(0, 1fr) 130px 110px 110px auto; gap: 8px; align-items: center; }
  form.add input, form.add select { width: 100%; min-width: 0; padding: 10px 12px; border: none; border-radius: 12px; font-size: 14px; outline: none; background: var(--fill); color: var(--text); }
  form.add input:focus, form.add select:focus { box-shadow: 0 0 0 2px var(--accent); }
  @media (max-width: 720px) {
    form.add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    form.add #fTitle,
    form.add #fNotes,
    form.add .btn { grid-column: 1 / -1; width: 100%; }
  }
  .todo { display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: var(--card); border-radius: 18px; margin-bottom: 10px; transition: all .2s; box-shadow: var(--shadow); }
  .todo.done { opacity: .55; }
  .todo.done .t-title { text-decoration: line-through; }
  input[type=checkbox] { width: 21px; height: 21px; margin-top: 1px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .t-main { flex: 1; min-width: 0; }
  .t-title { font-size: 15.5px; word-break: break-all; }
  .t-meta { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; white-space: nowrap; font-weight: 600; }
  .b-high { background: rgba(255,59,48,.12); color: var(--high); }
  .b-mid { background: rgba(255,149,0,.12); color: var(--mid); }
  .b-low { background: rgba(52,199,89,.12); color: var(--low); }
  .b-wx { background: rgba(7,193,96,.12); color: #07c160; }
  .b-qq { background: rgba(18,183,245,.12); color: #0b7eab; }
  .b-manual { background: var(--fill); color: var(--muted); }
  .due { font-weight: 600; }
  .due.overdue { color: var(--high); }
  .t-notes { margin-top: 7px; font-size: 13px; color: var(--muted); background: var(--fill); border-radius: 10px; padding: 8px 12px; word-break: break-all; }
  .del { border: none; background: transparent; color: #c7c7cc; cursor: pointer; font-size: 16px; padding: 4px 7px; border-radius: 999px; flex-shrink: 0; transition: all .15s; }
  .del:hover { color: var(--high); background: rgba(255,59,48,.1); }
  .empty { text-align: center; color: var(--muted); padding: 46px 0; font-size: 14px; }

  .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #c7c7cc; display: inline-block; }
  .live.on i { background: #34c759; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

  /* 视图切换转场 */
  .view-enter { animation: viewIn .35s var(--ease-smooth) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* 骨架屏 */
  .skeleton {
    background: linear-gradient(90deg, var(--fill) 25%, var(--card) 50%, var(--fill) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 18px;
    height: 90px;
    margin-bottom: 18px;
  }

  /* ── 弹窗 ── */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); backdrop-filter: saturate(180%) blur(8px); display: flex; align-items: center; justify-content: center; z-index: 50; animation: fadeUp .25s cubic-bezier(.25,.1,.25,1); }
  .modal-card { background: var(--card); border-radius: 22px; padding: 24px 26px; text-align: center; box-shadow: var(--shadow-lg); max-width: 92vw; animation: modalIn .35s var(--ease-spring) both; }
  @keyframes modalIn { from { opacity: 0; transform: scale(.9) translateY(12px); } to { opacity: 1; transform: none; } }
  .modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .modal-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .qr-box { background: #fff; border-radius: 16px; padding: 12px; display: inline-block; }
  .qr-box img { display: block; width: 220px; height: 220px; border-radius: 10px; }
  .modal-card .btn { margin-top: 14px; }
  .qr-hint { font-size: 13px; color: var(--accent); margin-top: 10px; }

  /* ── 轻提示(toast)── */
  #toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(16px); background: rgba(0, 0, 0, .84); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; opacity: 0; pointer-events: none; transition: all .25s var(--ease-smooth); z-index: 100; max-width: 86vw; text-align: center; box-shadow: var(--shadow-lg); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 醒目公告 ── */
  .ann-card { background: linear-gradient(135deg, #fffbeb, #ffe3b0) !important; border: 1.5px solid #f59e0b !important; animation: annGlow 2.2s ease-in-out infinite; }
  @keyframes annGlow { 0%, 100% { box-shadow: 0 4px 14px rgba(245, 158, 11, .22); } 50% { box-shadow: 0 4px 26px rgba(245, 158, 11, .55); } }
  .ann-card .h2 { color: #b45309; font-size: 15.5px; }
  .ann-item { background: rgba(255, 255, 255, .78); border-radius: 12px; padding: 10px 12px; margin-top: 8px; border-left: 4px solid #f59e0b; }
  .ann-item .ann-title { display: block; font-size: 14.5px; color: #92400e; margin-bottom: 4px; }
  .ann-item .sub { color: #57534e; }

  /* ── 移动端底部 Tab Bar(iOS 毛玻璃)── */
  .bottom-nav { display: none; }
  @media (max-width: 640px) {
    .wrap { padding: 0 12px calc(118px + env(safe-area-inset-bottom, 0px)); }
    header { padding: 12px 16px 10px; margin: 0 -12px 14px; }
    .hero h1 { font-size: 24px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .feat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { padding: 15px; margin-bottom: 12px; border-radius: 16px; }
    .vtabs { display: none; }
    .bottom-nav {
      display: flex;
      position: fixed;
      left: 10px; right: 10px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: .5px solid var(--line);
      border-radius: 22px;
      padding: 7px 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
      z-index: 40;
      justify-content: space-around;
    }
    .bottom-nav .vtab {
      border: none;
      background: transparent;
      padding: 7px 6px;
      border-radius: 12px;
      font-size: 10.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      flex: 1;
    }
    .bottom-nav .vtab .bicon { font-size: 21px; line-height: 1; }

  }
</style>
</head>

<script src="app-config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const PRIO = { high: ['高', 'b-high'], medium: ['中', 'b-mid'], low: ['低', 'b-low'] };
const SRC = { wechat: ['微信', 'b-wx'], qq: ['QQ', 'b-qq'], manual: ['手动', 'b-manual'] };
let filter = 'open';
let q = '';

/* ---- 服务器地址:手动配置 > 打包内置 > 当前页面自身 ---- */
const inApp = location.hostname === 'localhost' || location.protocol === 'capacitor:';
let BASE = (localStorage.getItem('server') || '').replace(/\/+$/, '');
if (!BASE && inApp) {
  BASE = (window.APP_CONFIG?.server || '').replace(/\/+$/, '');
}
let AUTH = (localStorage.getItem('token') || window.APP_CONFIG?.authToken || '').trim();
const rawFetch = window.fetch;
window.fetch = (input, init) => {
  const url = typeof input === 'string' && input.startsWith('/') ? BASE + input : input;
  init = init || {};
  if (AUTH) init.headers = { ...(init.headers || {}), 'x-auth-token': AUTH };
  return rawFetch(url, init).then((res) => {
    if (res.status === 401) $('#authModal').style.display = 'flex';
    return res;
  });
};

// 管理员登录(入口在「设置」页,验证通过后写入令牌)
$('#adminBtn').onclick = async () => {
  const v = $('#adminPass').value.trim();
  if (!v) { alert('请输入管理员密码'); return; }
  $('#adminBtn').textContent = '登录中…';
  try {
    const res = await rawFetch(`${BASE}/api/me`, { headers: { 'x-auth-token': v } });
    const d = await res.json().catch(() => ({}));
    if (res.ok && d.isAdmin) {
      localStorage.setItem('token', v);
      localStorage.removeItem('me');
      location.reload();
    } else {
      alert('密码错误,或该账号不是管理员');
      $('#adminBtn').textContent = '登录';
    }
  } catch (e) {
    alert('网络错误:' + e.message);
    $('#adminBtn').textContent = '登录';
  }
};
$('#adminPass').onkeydown = (e) => { if (e.key === 'Enter') $('#adminBtn').click(); };
$('#adminCancel').onclick = () => { $('#adminModal').style.display = 'none'; };
$('#bindBtn').onclick = async () => {
  const qq = $('#bindQq').value.trim();
  if (!/^\d{5,12}$/.test(qq)) { alert('请输入正确的 QQ 号(5~12 位数字)'); return; }
  $('#bindBtn').textContent = '绑定中…';
  try {
    const res = await rawFetch(`${BASE}/api/bind`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qq }),
    });
    const d = await res.json().catch(() => ({}));
    if (res.ok && d.token) {
      localStorage.setItem('token', d.token);
      localStorage.setItem('me', JSON.stringify({ name: d.name, owner: d.owner }));
      location.reload();
    } else {
      alert('登录失败:' + (d.error || res.status));
      $('#bindBtn').textContent = '登录 / 注册';
    }
  } catch (e) {
    alert('网络错误:' + e.message);
    $('#bindBtn').textContent = '登录 / 注册';
  }
};

// 服务器设置弹窗(仅当没有可用地址时自动弹出)
$('#setBtn').onclick = () => {
  document.querySelector('.vtab[data-v="settings"]').click();
};
$('#setClose').onclick = () => { $('#setModal').style.display = 'none'; };
$('#setSave').onclick = () => {
  const v = $('#setServer').value.trim().replace(/\/+$/, '');
  if (v) localStorage.setItem('server', v);
  else localStorage.removeItem('server');
  location.reload();
};
if (inApp && !BASE) $('#setModal').style.display = 'flex';

async function load() {
  const res = await fetch(`/api/todos?status=${filter}&q=${encodeURIComponent(q)}`);
  const data = await res.json();
  const s = data.stats;
  $('#stats').innerHTML = `共 <b>${s.total}</b> 项 · 未完成 <b class="hot">${s.open}</b> 项`;
  render(data.todos);
}

function fmtDue(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const same = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const now = new Date(), tom = new Date(Date.now()+86400000);
  if (same(d, now)) return { label: `今天 ${hm}`, overdue: d < now };
  if (same(d, tom)) return { label: `明天 ${hm}`, overdue: false };
  const base = `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
  return { label: d.getFullYear() === now.getFullYear() ? base : `${d.getFullYear()}年${base}`, overdue: d < now };
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/* 轻提示:操作有明确反馈 */
let _toastTm = null;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = el('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTm);
  _toastTm = setTimeout(() => t.classList.remove('show'), 2200);
}
// 把原本被静默吞掉的错误显示出来,便于定位问题
window.addEventListener('error', (e) => { try { toast('⚠️ ' + (e.message || '出错了')); } catch {} });
window.addEventListener('unhandledrejection', (e) => { const r = e.reason; try { toast('⚠️ ' + ((r && r.message) || r || '出错了')); } catch {} });

/* ================= App 自动更新检查(仅安卓 App 内) ================= */
let _updateVer = 0;
async function checkAppUpdate(manual) {
  const localCode = Number(window.APP_CONFIG?.versionCode || 0);
  if (!localCode) { if (manual) toast('ℹ️ 网页版无需更新,刷新即最新'); return; }
  try {
    const d = await fetch(`${BASE}/api/app/update?t=${Date.now()}`).then((r) => r.json());
    if (d.versionCode && d.versionCode > localCode) {
      if (!manual && Number(localStorage.getItem('skipAppVersion')) === Number(d.versionCode)) return;
      _updateVer = Number(d.versionCode);
      $('#updateText').textContent = `当前 v${window.APP_CONFIG.versionName || localCode} → 最新 v${d.versionName || d.versionCode},建议更新。`;
      $('#updateModal').style.display = 'flex';
    } else if (manual) {
      toast('✅ 已是最新版本');
    }
  } catch (e) {
    if (manual) toast('❌ 检查失败:' + e.message);
  }
}
$('#updateNow').onclick = () => {
  $('#updateModal').style.display = 'none';
  try { window.open(`${BASE}/app.apk`, '_system'); } catch { location.href = `${BASE}/app.apk`; }
};
$('#updateLater').onclick = () => {
  if (_updateVer) localStorage.setItem('skipAppVersion', String(_updateVer));
  $('#updateModal').style.display = 'none';
};

/* ================= App 本地弹窗(安卓 App 内原生通知) ================= */
function nativeNotify() {
  try { return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null; } catch { return null; }
}

async function appNotifyStatus() {
  const LN = nativeNotify();
  if (!LN) return { supported: false, granted: false };
  try {
    const p = await LN.checkPermissions();
    return { supported: true, granted: Boolean(p && p.display === 'granted') };
  } catch {
    return { supported: true, granted: false };
  }
}

async function enableAppNotify() {
  const LN = nativeNotify();
  if (!LN) return { ok: false, error: '需要在本机 App 内操作(网页版请用「开启推送」)' };
  try {
    const p = await LN.requestPermissions();
    if (!p || p.display !== 'granted') return { ok: false, error: '未获得通知权限,请在系统设置里允许' };
    await LN.schedule({ notifications: [{ id: 1, title: '✅ 弹窗提醒已开启', body: '待办到期前 1 小时会像这样弹窗提醒你', schedule: { at: new Date(Date.now() + 1500) } }] });
    scheduleTodoPops();
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

async function fireTestPop() {
  const LN = nativeNotify();
  if (!LN) { toast('❌ 仅支持在 App 内使用'); return; }
  try {
    await LN.schedule({ notifications: [{ id: 2, title: '🔔 测试弹窗', body: '这就是手机弹窗通知!', schedule: { at: new Date(Date.now() + 1000) } }] });
    toast('✅ 已发送测试弹窗');
  } catch (e) { toast('❌ 失败:' + e.message); }
}

/** 把 24 小时内到期(且未完成)的待办排成本地弹窗,每 30 秒同步一次 */
async function scheduleTodoPops() {
  const LN = nativeNotify();
  if (!LN) return;
  try {
    const p = await LN.checkPermissions();
    if (!p || p.display !== 'granted') return;
    const data = await fetch('/api/todos?status=open').then((r) => r.json()).catch(() => null);
    if (!data || !Array.isArray(data.todos)) return;
    const now = Date.now();
    const notifs = [];
    let i = 1000;
    for (const t of data.todos) {
      if (!t.due_at) continue;
      const due = new Date(t.due_at).getTime();
      const at = due - 60 * 60 * 1000; // 到期前 1 小时弹窗
      if (at > now && at < now + 24 * 3600 * 1000) {
        notifs.push({ id: ++i, title: '⏰ 待办即将到期', body: `${t.title}(到期 ${String(t.due_at).slice(11, 16)})`, schedule: { at: new Date(at) } });
      }
    }
    const ids = notifs.map((n) => ({ id: n.id }));
    try { await LN.cancel({ notifications: ids }); } catch {}
    if (notifs.length) await LN.schedule({ notifications: notifs });
  } catch {}
}

function render(todos) {
  const list = $('#list');
  list.innerHTML = '';
  $('#empty').style.display = todos.length ? 'none' : 'block';
  const frag = document.createDocumentFragment();
  for (const t of todos) {
    const li = el('li', 'todo' + (t.status === 'done' ? ' done' : ''));
    const cb = el('input');
    cb.type = 'checkbox';
    cb.checked = t.status === 'done';
    cb.onchange = () => toggle(t.id);
    const main = el('div', 't-main');
    main.appendChild(el('div', 't-title', t.title));
    const meta = el('div', 't-meta');
    const [pn, pc] = PRIO[t.priority] || PRIO.medium;
    meta.appendChild(el('span', `badge ${pc}`, pn + '优先级'));
    const [sn, sc] = SRC[t.source] || ['其他', 'b-manual'];
    meta.appendChild(el('span', `badge ${sc}`, sn));
    if (t.due_at) {
      const f = fmtDue(t.due_at);
      if (f) meta.appendChild(el('span', `due${f.overdue && t.status==='open' ? ' overdue' : ''}`, '⏰ ' + f.label));
    }
    const from = [t.chat_name, t.sender_name].filter(Boolean).join(' · ');
    if (from) meta.appendChild(el('span', null, '来自 ' + from));
    main.appendChild(meta);
    if (t.notes) main.appendChild(el('div', 't-notes', t.notes));
    li.appendChild(cb);
    li.appendChild(main);
    const del = el('button', 'del', '✕');
    del.title = '删除';
    del.onclick = () => remove(t.id);
    li.appendChild(del);
    frag.appendChild(li);
  }
  list.appendChild(frag);
}

async function toggle(id) { await fetch(`/api/todos/${id}/toggle`, { method: 'POST' }); load(); }
async function remove(id) {
  if (!confirm('确定删除这条待办?')) return;
  await fetch(`/api/todos/${id}`, { method: 'DELETE' });
  load();
}

document.querySelectorAll('.tab').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    filter = btn.dataset.f;
    load();
  };
});
let searchTimer;
$('#search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { q = e.target.value.trim(); load(); }, 250);
};
$('#addForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = {
    title: $('#fTitle').value.trim(),
    dueLocal: $('#fDue').value,
    priority: $('#fPriority').value,
    notes: $('#fNotes').value.trim(),
  };
  await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  $('#addForm').reset();
  load();
};

// SSE 实时更新(浏览器断线自动重连),另加 30s 兜底轮询
function connectSSE() {
  const es = new EventSource(BASE + '/api/events' + (AUTH ? `?token=${encodeURIComponent(AUTH)}` : ''));
  let sseTimer = null;
  es.addEventListener('update', () => {
    clearTimeout(sseTimer);
    sseTimer = setTimeout(() => { load(); loadSchedule(); loadHome(); }, 500);
  });
  es.addEventListener('status', (e) => renderStatus(JSON.parse(e.data)));
  es.addEventListener('chat', (e) => {
    const d = JSON.parse(e.data);
    if (chat.peer && d.peer === chat.peer && $('#chatMsgs')) {
      const m = d.message;
      if (m.id > chat.lastId) {
        chat.lastId = m.id;
        const mine = m.from_owner !== chat.peer;
        const b = el('div', 'chat-msg ' + (mine ? 'me' : 'you'), m.text);
        b.appendChild(el('span', 'cm-time', fmtChatTime(m.created_at)));
        $('#chatMsgs').appendChild(b);
        $('#chatMsgs').scrollTop = $('#chatMsgs').scrollHeight;
      }
      if (m.from_owner === chat.peer) fetch(`/api/chat/${encodeURIComponent(chat.peer)}/read`, { method: 'POST' }).catch(() => {});
    } else if ($('#chatView').style.display !== 'none') {
      loadChat();
    }
    refreshChatUnread();
  });
  es.addEventListener('weather', () => { loadHome(); });
  es.addEventListener('qr', (e) => {
    const d = JSON.parse(e.data);
    if (d.hasQr) showQr();

function weatherCond(code) {
  if (code === 0) return ['☀️', '晴', 'w-sun'];
  if (code === 1) return ['🌤', '晴间多云', 'w-sun'];
  if (code === 2) return ['⛅', '多云', 'w-cloud'];
  if (code === 3) return ['☁️', '阴', 'w-overcast'];
  if (code === 45 || code === 48) return ['🌫', '雾', 'w-fog'];
  if (code >= 71 && code <= 77) return ['❄️', '雪', 'w-snow'];

}

/* ---- Web Push(App 原生推送)---- */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return new Uint8Array([...rawData].map((c) => c.charCodeAt(0)));
}

async function getPushState() {
  if (!('serviceWorker' in navigator) || !('Notification' in window) || !('PushManager' in window)) return { state: 'unsupported' };
  const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
  if (!reg || !reg.pushManager) return { state: 'unsupported' };
  if (Notification.permission === 'denied') return { state: 'denied' };
  const sub = await reg.pushManager.getSubscription().catch(() => null);
  return { state: sub ? 'on' : 'off', sub, reg };
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('需要在浏览器设置中允许通知,才能收到推送'); return; }
    const reg = await navigator.serviceWorker.getRegistration() || await navigator.serviceWorker.register('sw.js');
    const vapid = await fetch('/api/push/vapid').then((r) => r.json());
    if (!vapid.enabled) { alert('服务端推送未配置'); return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(vapid.publicKey),
    });
    const res = await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    if (!res.ok) throw new Error('订阅保存失败');
    loadHome();
  } catch (e) {
    alert('开启推送失败:' + e.message);
  }
}

async function disablePush() {
  try {
    const { sub } = await getPushState();
    if (sub) {
      await fetch('/api/push/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
      await sub.unsubscribe();
    }
    loadHome();
  } catch (e) {
    alert('关闭失败:' + e.message);
  }
}

}

/* 应用背景 */
function applyBackground(bg) {
  const bodyEl = document.body;
  if (!bg) {
    bodyEl.style.background = '';
    bodyEl.style.backgroundAttachment = '';
    bodyEl.style.backgroundSize = '';
    return;
  }
  bodyEl.style.background = bg;
  if (bg.startsWith('url(')) {
    bodyEl.style.backgroundAttachment = 'fixed';
    bodyEl.style.backgroundSize = 'cover';
    bodyEl.style.backgroundPosition = 'center';
  } else {
    bodyEl.style.backgroundAttachment = 'fixed';
    bodyEl.style.backgroundSize = '';
  }
}

/* 图片压缩(长边 1080,JPEG 0.72) */
function compressImage(file, maxW = 1080) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.72));
      } catch (e) {
        reject(e);
      }
    };
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = url;
  });
}

/* 数字滚动动画(缓出,setTimeout 实现,不受标签页节流影响) */
function animateNum(el, target) {
  const t = Math.max(0, Number(target) || 0);
  if (!t) { el.textContent = '0'; return; }
  const dur = 700;
  const start = Date.now();
  const tick = () => {
    const p = Math.min(1, (Date.now() - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(t * eased);
    if (p < 1) setTimeout(tick, 16);
  };
  tick();
}

        body: JSON.stringify({ category: cI.value.trim(), title: tI.value.trim(), url: uI.value.trim(), description: dI.value.trim() }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || '添加失败'); return; }
      cI.value = tI.value = uI.value = dI.value = '';
      loadResources();
    };
    form.appendChild(cI); form.appendChild(tI); form.appendChild(uI); form.appendChild(dI); form.appendChild(addBtn);
    addBar.appendChild(form);
    box.appendChild(addBar);
  }

  // 资源卡片(按分类分组)
  const filtered = resList.filter((r) =>
    (resCat === '全部' || r.category === resCat) &&
    (!resQ || r.title.includes(resQ) || r.description.includes(resQ) || r.url.includes(resQ))
  );
  const byCat = {};
  for (const r of filtered) (byCat[r.category] ||= []).push(r);

  for (const cat of Object.keys(byCat)) {
    const card = el('div', 'card');
    card.appendChild(el('div', 'h2', `📚 ${cat}`));
    const grid = el('div', 'feat-grid');
    for (const r of byCat[cat]) {
      const a = el('a', 'feat', el('div', 'icon', '🔗'), el('div', 'name', r.title), el('div', 'desc', r.description || r.url), el('span', 'cmd', r.url.replace(/^https?:\/\//, '')));
      a.href = r.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.textDecoration = 'none';
      a.style.color = 'var(--text)';
      if (window.ME?.isAdmin) {
        const del = el('button', 'del', '✕');
        del.style.position = 'absolute';
        del.style.top = '6px';
        del.style.right = '6px';
        del.style.background = '#fff';
        del.onclick = async (ev) => {
          ev.preventDefault();
          if (!confirm(`删除「${r.title}」?`)) return;
          await fetch(`/api/resources/${r.id}`, { method: 'DELETE' });
          loadResources();
        };
        a.style.position = 'relative';
        a.appendChild(del);
      }
      grid.appendChild(a);
    }
    card.appendChild(grid);
    box.appendChild(card);
  }

  if (!filtered.length) box.appendChild(el('div', 'card pre', '没有匹配的资源。'));
}

async function loadBoard() {
  try {
    const data = await fetch('/api/posts').then((r) => r.json());
    renderBoard(data.posts || []);
  } catch {}
}

function renderBoard(posts) {
  const box = $('#boardView');
  box.innerHTML = '';

  // 发布框
  const composer = el('div', 'card');
  composer.appendChild(el('div', 'h2', '💬 留言板(全班可见)'));
  const ta = el('textarea');
  ta.className = 'search';
  ta.placeholder = '说点什么…(问问题 / 找队友 / 失物招领 / 二手)';
  ta.rows = 2;
  ta.style.width = '100%';
  ta.style.resize = 'vertical';
  const btnRow = el('div', 'toolbar');
  btnRow.style.marginTop = '8px';
  btnRow.style.justifyContent = 'flex-end';
  const pub = el('button', 'btn', '发布');
  pub.onclick = async () => {
    const content = ta.value.trim();
    if (!content) return;
    const r = await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (r.ok) { ta.value = ''; loadBoard(); }
  };
  btnRow.appendChild(pub);
  composer.appendChild(ta);
  composer.appendChild(btnRow);
  box.appendChild(composer);

  if (!posts.length) {
    box.appendChild(el('div', 'card pre', '还没有留言,来抢沙发吧 🛋'));
    return;
  }
  for (const p of posts) {
    const card = el('div', 'card');
    const head = el('div', 's-head');
    const who = el('b', 'who', `👤 ${p.name || '同学'}`);
    const time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const headR = el('span', 'sub', time);
    head.appendChild(who);
    head.appendChild(headR);
    card.appendChild(head);
    card.appendChild(el('div', 't-title', p.content));
    const replies = p.replies || [];

    if (p.mine) {
      const del = el('button', 'mini-btn', '删除');
      del.style.marginTop = '8px';
      del.onclick = async () => {
        if (!confirm('删除这条留言?')) return;
        await fetch(`/api/posts/${p.id}`, { method: 'DELETE' });
        loadBoard();
      };
      card.appendChild(del);
    }

    // 已有回复
    if (replies.length) {
      const rbox = el('div', 'replies-box');
      for (const rep of replies) {
        const line = el('div', 'reply');
        line.appendChild(el('span', 'rname', `${rep.name || '同学'}: `));
        line.appendChild(document.createTextNode(rep.content));
        line.appendChild(el('span', 'rtime', new Date(rep.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })));
        if (rep.mine) {
          const rd = el('button', 'rdel', '删除');
          rd.onclick = async () => {
            if (!confirm('删除这条回复?')) return;
            await fetch(`/api/post-replies/${rep.id}`, { method: 'DELETE' });
            loadBoard();
          };
          line.appendChild(rd);
        }
        rbox.appendChild(line);
      }
      card.appendChild(rbox);
    }

    // 回复入口 + 输入框(默认收起)
    const rlink = el('button', 'mini-btn', '💬 回复' + (replies.length ? ` (${replies.length})` : ''));
    rlink.style.marginTop = '8px';
    const rbar = el('div', 'replybar');
    rbar.style.display = 'none';
    const rinp = el('input');
    rinp.className = 'search';
    rinp.placeholder = '写下回复…';
    const rbtn = el('button', 'btn', '发送');
    rbtn.onclick = async () => {
      const c = rinp.value.trim();
      if (!c) return;
      rbtn.disabled = true;
      rbtn.textContent = '发送中…';
      const r = await fetch(`/api/posts/${p.id}/replies`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: c }),
      });
      if (r.ok) { rinp.value = ''; loadBoard(); }
      else { alert('回复失败'); rbtn.disabled = false; rbtn.textContent = '发送'; }
    };
    rinp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); rbtn.click(); } };
    rlink.onclick = () => {
      const open = rbar.style.display !== 'none';
      rbar.style.display = open ? 'none' : 'flex';
      if (!open) rinp.focus();
    };
    rbar.appendChild(rinp);
    rbar.appendChild(rbtn);
    card.appendChild(rlink);
    card.appendChild(rbar);

    box.appendChild(card);
  }
}

  const now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (d.toDateString() === now.toDateString()) return hm;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}

function setChatUnread(n) {
  document.querySelectorAll('.vtab[data-v="chat"]').forEach((b) => {
    const old = b.querySelector('.chdot');
    if (old) old.remove();
    if (n > 0) {
      const s = el('span', 'chdot', n > 99 ? '99+' : String(n));
      b.appendChild(s);
    }
  });
}

async function refreshChatUnread() {
  try {
    const d = await fetch('/api/chat/conversations').then((r) => r.json());
    setChatUnread(d.unread || 0);
  } catch {}
}

async function loadChat() {
  chat.peer = null;
  const box = $('#chatView');
  box.innerHTML = '';
  box.appendChild(el('div', 'card pre', '加载中…'));
  let convs = [];
  let friends = [];
  try {
    const [c, f] = await Promise.all([
      fetch('/api/chat/conversations').then((r) => r.json()),
      fetch('/api/friends').then((r) => r.json()),
    ]);
    convs = c.conversations || [];
    friends = f.friends || [];
    setChatUnread(c.unread || 0);
  } catch {
    box.innerHTML = '';
    box.appendChild(el('div', 'card pre', '加载失败,请重试'));
    return;
  }

  // 合并:机器人置顶 + 现有会话 + 还没聊过的好友
  const list = [];
  const seen = new Set();
  const botConv = convs.find((c) => c.peer === 'bot');
  list.push(botConv || { peer: 'bot', name: 'iTodo 机器人', last: null, unread: 0 });
  seen.add('bot');
  for (const c of convs) { if (!seen.has(c.peer)) { list.push(c); seen.add(c.peer); } }
  for (const f of friends) { if (!seen.has(f.owner)) { list.push({ peer: f.owner, name: f.name, last: null, unread: 0 }); seen.add(f.owner); } }

  box.innerHTML = '';
  const card = el('div', 'card');
  card.appendChild(el('div', 'h2', '💬 聊天'));
  for (const c of list) {
    const row = el('div', 'chat-row');
    const av = el('div', 'cavatar', c.peer === 'bot' ? '🤖' : (c.name || '?').slice(-2, -1) || (c.name || '?')[0]);
    const main = el('div', 'cmain');
    main.appendChild(el('div', 'cname', c.name));
    if (c.last) {
      const prefix = c.last.from === 'bot' || c.last.from === c.peer ? '' : '我:';
      main.appendChild(el('div', 'clast', prefix + String(c.last.text).replace(/\n/g, ' ')));
    } else {
      main.appendChild(el('div', 'clast', c.peer === 'bot' ? '发消息给机器人试试～' : '还没有聊天记录'));
    }
    row.appendChild(av);
    row.appendChild(main);
    if (c.unread) row.appendChild(el('div', 'cunread', String(c.unread)));
    row.onclick = () => openChat(c.peer, c.name);
    card.appendChild(row);
  }
  box.appendChild(card);

  if (!friends.length) {
    box.appendChild(el('div', 'card pre', '还没有好友。到「👋 好友」页搜索对方 QQ 号或昵称加好友后,就能在这里私聊。'));
  }
}

async function openChat(peer, name) {
  chat.peer = peer;
  chat.name = name || peer;
  chat.lastId = 0;
  const box = $('#chatView');
  box.innerHTML = '';
  const card = el('div', 'card');

  const head = el('div', 'toolbar');
  const back = el('button', 'mini-btn', '‹ 返回');
  back.onclick = () => loadChat();
  head.appendChild(back);
  head.appendChild(el('span', 'h2', chat.peer === 'bot' ? '🤖 iTodo 机器人' : chat.name));
  card.appendChild(head);

  const msgs = el('div', 'chat-msgs');
  msgs.id = 'chatMsgs';
  card.appendChild(msgs);

  const bar = el('div', 'toolbar');
  const inp = el('input');
  inp.className = 'search';
  inp.placeholder = '输入消息…';
  inp.id = 'chatInput';
  const send = el('button', 'btn', '发送');
  bar.appendChild(inp);
  bar.appendChild(send);
  card.appendChild(bar);
  box.appendChild(card);

  function append(m) {
    if (m.id <= chat.lastId) return;
    chat.lastId = m.id;
    const me = m.from_owner !== chat.peer;
    const b = el('div', 'chat-msg ' + (me ? 'me' : 'you'), m.text);
    b.appendChild(el('span', 'cm-time', fmtChatTime(m.created_at)));
    msgs.appendChild(b);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function sendMsg() {
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    try {
      const r = await fetch(`/api/chat/${encodeURIComponent(chat.peer)}/messages`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || '发送失败'); inp.value = text; return; }
      append(d.message);
    } catch (e) {
      alert('网络错误:' + e.message);
      inp.value = text;
    }
  }
  send.onclick = sendMsg;
  inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
  inp.focus();

  // 拉取历史
  try {
    const d = await fetch(`/api/chat/${encodeURIComponent(chat.peer)}/messages`).then((r) => r.json());
    for (const m of d.messages || []) append(m);
    if (!d.messages || !d.messages.length) {
      msgs.appendChild(el('div', 'sub', chat.peer === 'bot' ? '和机器人说句话吧,比如「明天 9 点交作业」' : '开始聊天吧'));
    }
  } catch {}
  fetch(`/api/chat/${encodeURIComponent(chat.peer)}/read`, { method: 'POST' }).catch(() => {});
  setChatUnread(0);
  refreshChatUnread();
}

/* ================= 好友 ================= */
function shortId(owner) { return String(owner || '').replace(/^qq:/, ''); }

async function loadFriends() {
  const box = $('#friendsView');
  box.innerHTML = '';
  box.appendChild(el('div', 'card pre', '加载中…'));
  let d;
  try {
    d = await fetch('/api/friends').then((r) => r.json());
  } catch {
    box.innerHTML = '';
    box.appendChild(el('div', 'card pre', '加载失败,请检查网络后重试'));
    return;
  }
  box.innerHTML = '';

  // 添加好友
  const add = el('div', 'card');
  add.appendChild(el('div', 'h2', '🔍 添加好友'));
  const bar = el('div', 'toolbar');
  const inp = el('input');
  inp.className = 'search';
  inp.placeholder = '输入对方 QQ 号或昵称';
  const sBtn = el('button', 'btn', '搜索');
  bar.appendChild(inp);
  bar.appendChild(sBtn);
  add.appendChild(bar);
  const results = el('div');
  add.appendChild(results);

  async function doSearch() {
    const q = inp.value.trim();
    if (!q) return;
    results.innerHTML = '';
    results.appendChild(el('div', 'sub', '搜索中…'));
    try {
      const r = await fetch('/api/friends/search?q=' + encodeURIComponent(q)).then((x) => x.json());
      results.innerHTML = '';
      const users = r.users || [];
      if (!users.length) { results.appendChild(el('div', 'sub', '没有找到用户,确认对方已在 App 里用 QQ 登录过。')); return; }
      for (const u of users) {
        const row = el('div', 'toolbar');
        row.style.marginBottom = '8px';
        row.appendChild(el('span', 't', `${u.name}(${shortId(u.owner)})`));
        const label = { friend: '已是好友', outgoing: '已发送', incoming: '待你通过' }[u.relation] || '添加';
        const b = el('button', u.relation === 'none' ? 'btn' : 'mini-btn', label);
        if (u.relation === 'none') {
          b.onclick = async () => {
            const res = await fetch('/api/friends/request', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ owner: u.owner }),
            });
            const rd = await res.json().catch(() => ({}));
            if (!res.ok) { alert(rd.error || '操作失败'); return; }
            alert(rd.accepted ? '对方也请求过你,已互相成为好友 ✔' : '好友请求已发送,等待对方通过');
            loadFriends();
          };
        } else {
          b.disabled = true;
          b.style.opacity = '.55';
        }
        row.appendChild(b);
        results.appendChild(row);
      }
    } catch {
      results.innerHTML = '';
      results.appendChild(el('div', 'sub', '搜索失败'));
    }
  }
  sBtn.onclick = doSearch;
  inp.onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
  box.appendChild(add);

  // 收到的请求
  if (d.incoming && d.incoming.length) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'h2', `📥 好友请求(${d.incoming.length})`));
    for (const r of d.incoming) {
      const row = el('div', 'toolbar');
      row.style.marginBottom = '8px';
      row.appendChild(el('span', 't', `${r.name}(${shortId(r.owner)})`));
      const ok = el('button', 'btn', '接受');
      ok.onclick = async () => { await fetch(`/api/friends/${r.id}/accept`, { method: 'POST' }); loadFriends(); };
      const no = el('button', 'mini-btn', '拒绝');
      no.onclick = async () => { await fetch(`/api/friends/${r.id}/reject`, { method: 'POST' }); loadFriends(); };
      row.appendChild(ok);
      row.appendChild(no);
      c.appendChild(row);
    }
    box.appendChild(c);
  }

  // 已发送
  if (d.outgoing && d.outgoing.length) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'h2', `⏳ 已发送(${d.outgoing.length})`));
    for (const r of d.outgoing) {
      const row = el('div', 'toolbar');
      row.style.marginBottom = '8px';
      row.appendChild(el('span', 't', `${r.name}(${shortId(r.owner)})· 等待通过`));
      const no = el('button', 'mini-btn', '取消');
      no.onclick = async () => { await fetch(`/api/friends/${r.id}`, { method: 'DELETE' }); loadFriends(); };
      row.appendChild(no);
      c.appendChild(row);
    }
    box.appendChild(c);
  }

  // 我的好友
  const c2 = el('div', 'card');
  c2.appendChild(el('div', 'h2', `👥 我的好友(${(d.friends || []).length})`));
  if (!d.friends || !d.friends.length) {
    c2.appendChild(el('div', 'sub', '还没有好友。在上方搜索对方的 QQ 号或昵称,发送好友请求吧。'));
  } else {
    for (const f of d.friends) {
      const row = el('div', 'toolbar');
      row.style.marginBottom = '8px';
      row.appendChild(el('span', 't', `${f.name}(${shortId(f.owner)})`));
      const del = el('button', 'mini-btn', '删除');
      del.onclick = async () => {
        if (!confirm(`确定删除好友「${f.name}」?`)) return;
        await fetch(`/api/friends/${f.id}`, { method: 'DELETE' });
        loadFriends();
      };
      row.appendChild(del);
      c2.appendChild(row);
    }
  }
  box.appendChild(c2);
}

async function loadSchedule() {
  try {
    const res = await fetch('/api/schedule');
    const data = await res.json();
    renderSchedule(data.users || [], data.weather);
  } catch {}
}

function renderSchedule(users, weather) {
  const box = $('#scheduleView');
  box.innerHTML = '';

  // 上传课表文件导入(iOS/安卓/电脑通用)
  const isAdmin = window.ME?.isAdmin;
  const up = el('div', 'card');
  up.appendChild(el('div', 'h2', '📥 导入课表(文件 / 图片)'));
  const row = el('div', 'toolbar');
  let ownerInp = null;
  if (isAdmin) {
    ownerInp = el('input');
    ownerInp.className = 'search';
    ownerInp.placeholder = '导入到哪个 QQ 号(如 1487138742)';
    ownerInp.value = localStorage.getItem('importOwner') || '1487138742';
  }
  const fileInp = el('input');
  fileInp.type = 'file';
  fileInp.accept = '.xlsx,.xls,.csv,image/*';
  fileInp.style.display = 'none';
  const pick = el('button', 'btn', '选择文件');
  pick.onclick = () => fileInp.click();
  fileInp.onchange = async () => {
    const f = fileInp.files[0];
    if (!f) return;
    if (isAdmin) localStorage.setItem('importOwner', ownerInp.value.trim());
    pick.textContent = '导入中…';
    pick.disabled = true;
    try {
      const buf = await f.arrayBuffer();
      const q = isAdmin ? `?owner=qq:${encodeURIComponent(ownerInp.value.trim())}` : '';
      const res = await fetch(`/api/schedule/import${q}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: buf,
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok) { alert(`✅ 导入成功,共 ${d.count} 节课`); loadSchedule(); }
      else alert(`❌ 导入失败:${d.error || res.status}`);
    } catch (e) {
      alert('导入出错:' + e.message);
    }
    pick.textContent = '选择文件';
    pick.disabled = false;
    fileInp.value = '';
  };
  if (ownerInp) row.appendChild(ownerInp);
  row.appendChild(pick);
  row.appendChild(el('span', 'live', '支持:教务导出的「网格/列表」课表(xlsx / xls / csv),或课表截图(jpg/png 自动识别);图片识别失败时,可用「豆包」识别后把文字粘贴给机器人'));
  up.appendChild(row);
  box.appendChild(up);

  if (!users.length) {
    const w = weather?.city ? `\n管理员已配置天气推送:${weather.city} 每天 ${weather.notifyTime}` : '';
    box.appendChild(el('div', 'card pre', `还没有学生提交课表。\n让学生给机器人私聊发送课表,或在上方直接上传课表文件。\n\n课表\n周一 08:00-09:40 高等数学 @一教101\n周一 10:00-11:40 大学英语 1-16周\n周二 14:00-15:40 物理实验 双周\n\n每天 21:00 机器人会私聊提醒学生第二天的课程。${w}`));
    return;
  }
  for (const u of users) {
    const card = el('div', 'card');
    const head = el('div', 's-head');
    head.appendChild(el('b', 'who', u.name || u.owner));
    const meta = [];
    if (u.semester_start) meta.push(`开学 ${u.semester_start}`);
    if (u.currentWeek) meta.push(`第${u.currentWeek}周`);
    meta.push(`提醒 ${u.notify_time || '21:00'}`);
    meta.push(u.push_kind ? `推送 ${u.push_kind === 'bark' ? 'Bark' : 'PushDeer'}` : '未绑推送');
    meta.push(`🍅今日 ${u.pomodoroToday || 0}`);
    head.appendChild(el('span', 'sub', `${u.owner} · ` + meta.join(' · ')));
    card.appendChild(head);

    const days = {};
    u.items.forEach((it) => { (days[it.day] ||= []).push(it); });
    for (const wd of [1, 2, 3, 4, 5, 6, 0]) {
      const arr = (days[wd] || []).slice().sort((a, b) => a.start_min - b.start_min);
      if (!arr.length) continue;
      const dl = el('div', 's-day');
      dl.appendChild(el('div', 's-dayname', WD[wd] + ` (${arr.length}节)`));
      for (const it of arr) {
        const row = el('div', 's-item');
        let label = `${fmtMin(it.start_min)}-${fmtMin(it.end_min)} ${it.name}`;
        if (it.location) label += ` @${it.location}`;
        row.appendChild(el('span', 't', label));
        const wl = [];
        if (it.week_start && it.week_end) wl.push(it.week_start === it.week_end ? `${it.week_start}周` : `${it.week_start}-${it.week_end}周`);
        if (it.parity === 'odd') wl.push('单周');
        if (it.parity === 'even') wl.push('双周');
        if (wl.length) row.appendChild(el('span', 's-week', wl.join(' ')));
        const del = el('button', 'del', '✕');
        del.title = '删除这节课';
        del.onclick = async () => {
          if (!confirm('删除这节课?')) return;
          await fetch(`/api/schedule/item/${it.id}`, { method: 'DELETE' });
          loadSchedule();
        };
        row.appendChild(del);
        dl.appendChild(row);
      }
      card.appendChild(dl);
    }

    const actions = el('div', 's-actions');
    if (isAdmin) {
      const clearBtn = el('button', 'mini-btn', '清空该学生课表');
      clearBtn.onclick = async () => {
        if (!confirm(`确定清空「${u.name || u.owner}」的课表?`)) return;
        await fetch(`/api/schedule/${encodeURIComponent(u.owner)}`, { method: 'DELETE' });
        loadSchedule();
      };
      actions.appendChild(clearBtn);
      card.appendChild(actions);
    }
    box.appendChild(card);
  }
}
</script>
