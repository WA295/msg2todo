<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>校园生活管家 · msg2todo</title>
<meta name="theme-color" content="#4f6ef7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办助手">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    /* iOS 系统色 */
    --bg: #f2f2f7;
    --card: #ffffff;
    --line: #e5e5ea;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --accent: #007aff;
    --accent-2: #3395ff;
    --accent-soft: rgba(0, 122, 255, .1);
    --high: #ff3b30; --mid: #ff9500; --low: #34c759;
    --wx: #07c160; --qq: #12b7f5; --manual: #98989f;
    --fill: #e9e9eb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .08);
    --glass: rgba(255, 255, 255, .72);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --line: #38383a;
      --text: #ffffff;
      --muted: #98989f;
      --accent: #0a84ff;
      --accent-2: #409cff;
      --accent-soft: rgba(10, 132, 255, .22);
      --fill: #2c2c2e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .6);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, .6);
      --glass: rgba(28, 28, 30, .72);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 110px; }

  /* ── Hero:毛玻璃大标题(iOS Large Title)── */
  header { position: sticky; top: 0; z-index: 30; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); margin: 0 -16px 16px; padding: 14px 18px 12px; border-bottom: .5px solid var(--line); }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
  .hero .date { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .hero .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hero .conns { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 11px; border-radius: 999px; font-size: 11.5px; background: var(--fill); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .chip .light { width: 7px; height: 7px; border-radius: 50%; background: #c7c7cc; }
  .chip.ok .light { background: #34c759; }
  .stats { font-size: 12.5px; color: var(--muted); }
  .stats b { color: var(--text); font-size: 14px; margin: 0 2px; }
  .stats b.hot { color: var(--high); }
  .mini-btn { border: none; background: var(--fill); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 600; transition: opacity .15s; }
  .mini-btn:hover { opacity: .7; }
  .mini-btn:active { opacity: .5; }

  /* ── 卡片:分组圆角(iOS Grouped)── */
  .card {
    background: var(--card);
    border: none;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    animation: fadeUp .35s cubic-bezier(.25, .1, .25, 1) both;
  }
  .h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 6px 10px; letter-spacing: .3px; }
  summary.h2 { cursor: pointer; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; background: var(--fill); padding: 2px; border-radius: 10px; }
  .tab { border: none; background: transparent; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); transition: all .2s; }
  .tab.on { background: var(--card); font-weight: 600; box-shadow: var(--shadow); }
  .search { flex: 1; min-width: 140px; padding: 10px 14px; border: none; border-radius: 12px; font-size: 14px; outline: none; background: var(--fill); color: var(--text); transition: background .15s; }
  .search:focus { background: var(--card); box-shadow: 0 0 0 2px var(--accent); }

  .btn {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn:active { opacity: .6; }

  /* ── 总览 ── */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--card); border-radius: 18px; padding: 16px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat-card .num { font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: -.5px; }
  .stat-card .lbl { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .feat { background: var(--card); border-radius: 18px; padding: 16px 13px; cursor: pointer; transition: transform .2s cubic-bezier(.25,.1,.25,1), box-shadow .2s; position: relative; display: block; box-shadow: var(--shadow); }
  .feat:hover { transform: scale(1.02); box-shadow: var(--shadow-lg); }
  .feat:active { transform: scale(.97); }
  .feat .icon { font-size: 25px; }
  .feat .name { font-size: 14px; font-weight: 600; margin-top: 9px; }
  .feat .desc { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; word-break: break-all; }
  .feat .cmd { font-size: 10.5px; color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 2px 8px; margin-top: 8px; display: inline-block; font-weight: 600; }
  .tl { list-style: none; }
  .tl li { display: flex; align-items: center; gap: 10px; padding: 10px 6px; font-size: 14px; border-radius: 10px; }
  .tl .t { font-weight: 600; color: var(--accent); min-width: 96px; }
  .weather-box { position: relative; overflow: hidden; color: #fff; border-radius: 20px; padding: 22px; margin-bottom: 18px; box-shadow: var(--shadow-lg); animation: fadeUp .4s cubic-bezier(.25,.1,.25,1) both; transition: background .6s ease; }
  .weather-box.w-sun { background: linear-gradient(160deg, #2f8fff 0%, #5fb4ff 100%); }
  .weather-box.w-cloud { background: linear-gradient(160deg, #5d7fa6 0%, #8fa8c7 100%); }
  .weather-box.w-overcast { background: linear-gradient(160deg, #6d7d92 0%, #9aa8bb 100%); }
  .weather-box.w-fog { background: linear-gradient(160deg, #8494a8 0%, #b6c2d0 100%); }
  .weather-box.w-rain { background: linear-gradient(160deg, #33435f 0%, #55688a 100%); }
  .weather-box.w-snow { background: linear-gradient(160deg, #6f9cc4 0%, #c3dcef 100%); }
  .weather-box.w-storm { background: linear-gradient(160deg, #252c44 0%, #434d6e 100%); }
  .weather-box .w-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .weather-box .w-icon { font-size: 34px; line-height: 1; animation: wfloat 3s ease-in-out infinite; }
  .weather-box.w-sun .w-icon { animation: wpulse 2.5s ease-in-out infinite; }
  .weather-box .w-cond { font-size: 15px; font-weight: 700; }
  .weather-box .w-lines { font-size: 13.5px; line-height: 1.95; opacity: .97; white-space: pre-line; }
  .weather-box.w-rain::after, .weather-box.w-storm::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(transparent 0%, rgba(255,255,255,.14) 100%);
    background-size: 100% 28px;
    animation: wrain 1.2s linear infinite;
    opacity: .5;
  }
  @keyframes wfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes wpulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,220,100,.8)); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(255,220,100,1)); } }
  @keyframes wrain { from { background-position: 0 -28px; } to { background-position: 0 0; } }
  .tom-cls { display: flex; align-items: center; gap: 10px; padding: 9px 6px; font-size: 14px; border-radius: 10px; }
  .tom-cls .tm { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .cd-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 6px; font-size: 14px; border-radius: 10px; }
  .cd-item .d { font-weight: 700; color: var(--high); white-space: nowrap; }
  .cheat { font-size: 13px; line-height: 2; color: var(--text); }
  .cheat code { background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 6px; font-size: 12px; }

  /* ── 设置列表(iOS Grouped List)── */
  .set-row { display: flex; align-items: center; gap: 12px; padding: 13px 8px; border-bottom: .5px solid var(--line); cursor: pointer; transition: background .15s; }
  .set-row:last-child { border-bottom: none; }
  .set-row:active { background: var(--fill); }
  .set-row .sicon { font-size: 21px; width: 28px; text-align: center; }
  .set-row .sname { flex: 1; font-size: 15px; }
  .set-row .sval { font-size: 13px; color: var(--muted); text-align: right; max-width: 46%; word-break: break-all; }
  .set-row .arrow { color: #c7c7cc; font-size: 17px; }

  /* ── 顶部/底部导航 ── */
  .vtabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .vtabs::-webkit-scrollbar { display: none; }
  .vtab { border: none; background: var(--fill); padding: 9px 18px; border-radius: 999px; cursor: pointer; font-size: 13.5px; color: var(--text); white-space: nowrap; transition: all .2s; }
  .vtab.on { background: var(--accent); color: #fff; font-weight: 600; }

  /* ── 课表 ── */
  .s-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .s-head .who { font-size: 15px; }
  .s-head .sub { font-size: 12px; color: var(--muted); }
  .s-day { margin-bottom: 12px; }
  .s-dayname { font-size: 12.5px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .s-item { display: flex; align-items: center; gap: 10px; padding: 9px 6px; font-size: 14px; border-radius: 10px; }
  .s-item .t { flex: 1; min-width: 0; word-break: break-all; }
  .s-week { font-size: 11px; color: var(--muted); background: var(--fill); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .card.pre { white-space: pre-line; }
  .s-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

  /* ── 待办 ── */
  .list { list-style: none; }
  form.add { display: grid; grid-template-columns: 1fr 130px 110px 110px auto; gap: 8px; align-items: center; }
  form.add input, form.add select { padding: 10px 12px; border: none; border-radius: 12px; font-size: 14px; outline: none; background: var(--fill); color: var(--text); }
  form.add input:focus, form.add select:focus { box-shadow: 0 0 0 2px var(--accent); }
  @media (max-width: 720px) {
    form.add { grid-template-columns: 1fr 1fr; }
    form.add .btn { grid-column: span 2; }
  }
  .todo { display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: var(--card); border-radius: 18px; margin-bottom: 10px; transition: all .2s; box-shadow: var(--shadow); }
  .todo.done { opacity: .55; }
  .todo.done .t-title { text-decoration: line-through; }
  input[type=checkbox] { width: 21px; height: 21px; margin-top: 1px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .t-main { flex: 1; min-width: 0; }
  .t-title { font-size: 15.5px; word-break: break-all; }
  .t-meta { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; white-space: nowrap; font-weight: 600; }
  .b-high { background: rgba(255,59,48,.12); color: var(--high); }
  .b-mid { background: rgba(255,149,0,.12); color: var(--mid); }
  .b-low { background: rgba(52,199,89,.12); color: var(--low); }
  .b-wx { background: rgba(7,193,96,.12); color: #07c160; }
  .b-qq { background: rgba(18,183,245,.12); color: #0b7eab; }
  .b-manual { background: var(--fill); color: var(--muted); }
  .due { font-weight: 600; }
  .due.overdue { color: var(--high); }
  .t-notes { margin-top: 7px; font-size: 13px; color: var(--muted); background: var(--fill); border-radius: 10px; padding: 8px 12px; word-break: break-all; }
  .del { border: none; background: transparent; color: #c7c7cc; cursor: pointer; font-size: 16px; padding: 4px 7px; border-radius: 999px; flex-shrink: 0; transition: all .15s; }
  .del:hover { color: var(--high); background: rgba(255,59,48,.1); }
  .empty { text-align: center; color: var(--muted); padding: 46px 0; font-size: 14px; }

  .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #c7c7cc; display: inline-block; }
  .live.on i { background: #34c759; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── 弹窗 ── */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); backdrop-filter: saturate(180%) blur(8px); display: flex; align-items: center; justify-content: center; z-index: 50; animation: fadeUp .25s cubic-bezier(.25,.1,.25,1); }
  .modal-card { background: var(--card); border-radius: 22px; padding: 24px 26px; text-align: center; box-shadow: var(--shadow-lg); max-width: 92vw; }
  .modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .modal-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .qr-box { background: #fff; border-radius: 16px; padding: 12px; display: inline-block; }
  .qr-box img { display: block; width: 220px; height: 220px; border-radius: 10px; }
  .modal-card .btn { margin-top: 14px; }
  .qr-hint { font-size: 13px; color: var(--accent); margin-top: 10px; }

  /* ── 移动端底部 Tab Bar(iOS 毛玻璃)── */
  .bottom-nav { display: none; }
  @media (max-width: 640px) {
    .wrap { padding: 0 12px 96px; }
    header { padding: 12px 16px 10px; margin: 0 -12px 14px; }
    .hero h1 { font-size: 24px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .feat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { padding: 15px; margin-bottom: 12px; border-radius: 16px; }
    .vtabs { display: none; }
    .bottom-nav {
      display: flex;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: .5px solid var(--line);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      z-index: 40;
      justify-content: space-around;
    }
    .bottom-nav .vtab {
      border: none;
      background: transparent;
      padding: 7px 6px;
      border-radius: 12px;
      font-size: 10.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      flex: 1;
    }
    .bottom-nav .vtab .bicon { font-size: 21px; line-height: 1; }
    .bottom-nav .vtab.on { background: transparent; color: var(--accent); font-weight: 600; }
    .modal-card { padding: 20px 22px; margin: 16px; }
    .todo { padding: 14px; margin-bottom: 8px; border-radius: 16px; }
    .t-title { font-size: 15px; }
    .del { font-size: 20px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hero">
      <div>
        <h1>🏫 校园生活管家</h1>
        <div class="date" id="heroDate"></div>
      </div>
      <div class="actions">
        <div class="conns" id="conns"></div>
        <button class="mini-btn" id="wxBtn">微信登录</button>
        <button class="mini-btn" id="setBtn">⚙️ 服务器</button>
        <span class="stats" id="meLabel" style="display:none"></span>
        <button class="mini-btn" id="logoutBtn" style="display:none">退出登录</button>
        <span class="stats" id="stats"></span>
      </div>
    </div>
  </header>

  <div class="vtabs">
    <button class="vtab on" data-v="home">🏠 总览</button>
    <button class="vtab" data-v="todo">📝 待办</button>
    <button class="vtab" data-v="sched">📚 课表</button>
    <button class="vtab" data-v="res">📖 学习资源</button>
    <button class="vtab" data-v="board">💬 留言板</button>
    <button class="vtab" data-v="settings">⚙️ 设置</button>
  </div>

  <nav class="bottom-nav">
    <button class="vtab on" data-v="home"><span class="bicon">🏠</span>总览</button>
    <button class="vtab" data-v="todo"><span class="bicon">📝</span>待办</button>
    <button class="vtab" data-v="sched"><span class="bicon">📚</span>课表</button>
    <button class="vtab" data-v="res"><span class="bicon">📖</span>资源</button>
    <button class="vtab" data-v="board"><span class="bicon">💬</span>留言板</button>
    <button class="vtab" data-v="settings"><span class="bicon">⚙️</span>设置</button>
  </nav>

  <div id="homeView"></div>

  <div id="todoView" style="display:none">
    <div class="card">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab on" data-f="open">未完成</button>
          <button class="tab" data-f="done">已完成</button>
          <button class="tab" data-f="all">全部</button>
        </div>
        <input class="search" id="search" placeholder="搜索标题 / 备注 / 来源…" />
        <span class="live" id="live"><i></i><span id="liveText">已连接</span></span>
      </div>
    </div>

    <div class="card">
      <form class="add" id="addForm">
        <input id="fTitle" placeholder="手动添加待办…" required />
        <input id="fDue" type="datetime-local" />
        <select id="fPriority">
          <option value="medium">中优先级</option>
          <option value="high">高优先级</option>
          <option value="low">低优先级</option>
        </select>
        <input id="fNotes" placeholder="备注(可选)" />
        <button class="btn" type="submit">添加</button>
      </form>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" style="display:none">暂无待办 🎉</div>
  </div>

  <div id="scheduleView" style="display:none"></div>

  <div id="resourceView" style="display:none"></div>

  <div id="boardView" style="display:none"></div>

  <div id="settingsView" style="display:none"></div>
</div>

<div class="modal" id="qrModal" style="display:none">
  <div class="modal-card">
    <h3>📱 微信扫码登录</h3>
    <div class="sub">打开手机微信 → 扫一扫</div>
    <div class="qr-box"><img id="qrImg" alt="微信登录二维码"></div>
    <div class="qr-hint" id="qrHint">二维码加载中…</div>
    <button class="btn" id="qrClose">关闭</button>
  </div>
</div>

<div class="modal" id="setModal" style="display:none">
  <div class="modal-card" style="text-align:left; min-width:min(340px, 90vw)">
    <h3 style="text-align:center">⚙️ 服务器设置</h3>
    <div class="sub" style="text-align:center">填写 msg2todo 服务所在地址(手机 App 必填)</div>
    <input id="setServer" placeholder="如 http://192.168.1.100:8080" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; outline:none" />
    <div style="display:flex; gap:10px; margin-top:14px">
      <button class="btn" id="setSave" style="flex:1">保存并刷新</button>
      <button class="mini-btn" id="setClose" style="flex:0">取消</button>
    </div>
    <div class="sub" style="margin-top:12px">留空 = 使用打开页面自身的地址(PWA 模式)。手机 App 与电脑需同一网络,或填云端服务器地址。</div>
  </div>
</div>

<div class="modal" id="ctrlModal" style="display:none">
  <div class="modal-card" style="text-align:left; min-width:min(400px, 92vw); max-height:80vh; overflow-y:auto">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <h3 id="ctrlTitle" style="margin:0">控制面板</h3>

/* ---- 服务器地址:手动配置 > 打包内置 > 当前页面自身 ---- */
const inApp = location.hostname === 'localhost' || location.protocol === 'capacitor:';
let BASE = (localStorage.getItem('server') || '').replace(/\/+$/, '');

  BASE = (window.APP_CONFIG?.server || '').replace(/\/+$/, '');
}
let AUTH = (localStorage.getItem('token') || window.APP_CONFIG?.authToken || '').trim();
const rawFetch = window.fetch;
window.fetch = (input, init) => {

  init = init || {};

  return rawFetch(url, init).then((res) => {

function fmtDue(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const same = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const now = new Date(), tom = new Date(Date.now()+86400000);
  if (same(d, now)) return { label: `今天 ${hm}`, overdue: d < now };
  if (same(d, tom)) return { label: `明天 ${hm}`, overdue: false };
  const base = `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
  return { label: d.getFullYear() === now.getFullYear() ? base : `${d.getFullYear()}年${base}`, overdue: d < now };
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function render(todos) {
  const list = $('#list');
  list.innerHTML = '';
  $('#empty').style.display = todos.length ? 'none' : 'block';
  const frag = document.createDocumentFragment();
  for (const t of todos) {
    const li = el('li', 'todo' + (t.status === 'done' ? ' done' : ''));
    const cb = el('input');
    cb.type = 'checkbox';
    cb.checked = t.status === 'done';
    cb.onchange = () => toggle(t.id);
    const main = el('div', 't-main');
    main.appendChild(el('div', 't-title', t.title));
    const meta = el('div', 't-meta');
    const [pn, pc] = PRIO[t.priority] || PRIO.medium;
    meta.appendChild(el('span', `badge ${pc}`, pn + '优先级'));
    const [sn, sc] = SRC[t.source] || ['其他', 'b-manual'];
    meta.appendChild(el('span', `badge ${sc}`, sn));
    if (t.due_at) {
      const f = fmtDue(t.due_at);
      if (f) meta.appendChild(el('span', `due${f.overdue && t.status==='open' ? ' overdue' : ''}`, '⏰ ' + f.label));
    }
    const from = [t.chat_name, t.sender_name].filter(Boolean).join(' · ');
    if (from) meta.appendChild(el('span', null, '来自 ' + from));
    main.appendChild(meta);
    if (t.notes) main.appendChild(el('div', 't-notes', t.notes));
    li.appendChild(cb);
    li.appendChild(main);
    const del = el('button', 'del', '✕');
    del.title = '删除';
    del.onclick = () => remove(t.id);
    li.appendChild(del);
    frag.appendChild(li);
  }
  list.appendChild(frag);
}

async function toggle(id) { await fetch(`/api/todos/${id}/toggle`, { method: 'POST' }); load(); }
async function remove(id) {

}

// SSE 实时更新(浏览器断线自动重连),另加 30s 兜底轮询
function connectSSE() {
  const es = new EventSource(BASE + '/api/events' + (AUTH ? `?token=${encodeURIComponent(AUTH)}` : ''));
  let sseTimer = null;
  es.addEventListener('update', () => {
    clearTimeout(sseTimer);
    sseTimer = setTimeout(() => { load(); loadSchedule(); loadHome(); }, 500);
  });
  es.addEventListener('status', (e) => renderStatus(JSON.parse(e.data)));
  es.addEventListener('qr', (e) => {
    const d = JSON.parse(e.data);
    if (d.hasQr) showQr();
    else if (!$('#qrModal').dataset.manual) hideQr();
  });
  es.onopen = () => { $('#live').classList.add('on'); $('#liveText').textContent = '实时连接中'; };
  es.onerror = () => { $('#live').classList.remove('on'); $('#liveText').textContent = '重连中…'; };
}

/* WMO 天气代码 → [图标, 名称, 样式类] */
function weatherCond(code) {
  if (code === 0) return ['☀️', '晴', 'w-sun'];
  if (code === 1) return ['🌤', '晴间多云', 'w-sun'];
  if (code === 2) return ['⛅', '多云', 'w-cloud'];
  if (code === 3) return ['☁️', '阴', 'w-overcast'];
  if (code === 45 || code === 48) return ['🌫', '雾', 'w-fog'];
  if (code >= 71 && code <= 77) return ['❄️', '雪', 'w-snow'];
  if (code >= 85 && code <= 86) return ['🌨', '阵雪', 'w-snow'];
  if (code >= 95) return ['⛈', '雷雨', 'w-storm'];
  return ['🌧', '雨', 'w-rain']; // 51-67, 80-82
}

/* ---- Web Push(App 原生推送)---- */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return new Uint8Array([...rawData].map((c) => c.charCodeAt(0)));
}

async function getPushState() {
  if (!('serviceWorker' in navigator) || !('Notification' in window) || !('PushManager' in window)) return { state: 'unsupported' };
  const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
  if (!reg || !reg.pushManager) return { state: 'unsupported' };
  if (Notification.permission === 'denied') return { state: 'denied' };
  const sub = await reg.pushManager.getSubscription().catch(() => null);
  return { state: sub ? 'on' : 'off', sub, reg };
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('需要在浏览器设置中允许通知,才能收到推送'); return; }
    const reg = await navigator.serviceWorker.getRegistration() || await navigator.serviceWorker.register('sw.js');
    const vapid = await fetch('/api/push/vapid').then((r) => r.json());
    if (!vapid.enabled) { alert('服务端推送未配置'); return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(vapid.publicKey),
    });
    const res = await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    if (!res.ok) throw new Error('订阅保存失败');
    loadHome();
  } catch (e) {
    alert('开启推送失败:' + e.message);
  }
}

async function disablePush() {
  try {
    const { sub } = await getPushState();
    if (sub) {
      await fetch('/api/push/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
      await sub.unsubscribe();
    }
    loadHome();
  } catch (e) {
    alert('关闭失败:' + e.message);
  }
}

async function renderPushCard(frag) {
  const card = el('div', 'card');
  card.appendChild(el('div', 'h2', '🔔 消息推送'));
  const row = el('div', 'toolbar');
  const st = await getPushState();
  if (st.state === 'on') {
    row.appendChild(el('span', 'live on', '✅ 已开启:提醒将直达手机通知中心'));
    const btn = el('button', 'mini-btn', '关闭推送');
    btn.onclick = disablePush;
    row.appendChild(btn);
  } else if (st.state === 'off') {
    row.appendChild(el('span', 'live', '未开启:开启后天气/课表/倒计时提醒直达手机(不依赖 QQ)'));
    const btn = el('button', 'btn', '开启推送');
    btn.onclick = enablePush;
    row.appendChild(btn);
  } else if (st.state === 'denied') {
    row.appendChild(el('span', 'live', '❌ 通知权限被拒绝,请在浏览器设置中允许本站通知'));
  } else {
    row.appendChild(el('span', 'live', '此浏览器不支持 Web Push(iPhone 需 iOS 16.4+ 且从主屏幕打开)'));
  }
  card.appendChild(row);
  frag.appendChild(card);
}

async function openCtrl(id, title) {

  }
  body.innerHTML = '';
  const post = async (url, data) => {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}) });
    const d = await r.json().catch(() => ({}));

    loadSchedule();
    return true;
  };

  const mkBtn = (text, onClick, cls = 'btn') => { const b = el('button', cls, text); b.onclick = onClick; return b; };
  const row = (label, node) => { const r = el('div', 'toolbar'); r.style.marginBottom = '10px'; r.appendChild(el('span', 'live', label)); r.appendChild(node); return r; };
  const sub = el('div', 'sub');
  sub.style.marginTop = '10px';

  if (id === 'pomo') {
    if (s.pomodoro.running) {
      const r = s.pomodoro.running;
      body.appendChild(el('div', 'h2', `进行中:第 ${r.round}/${r.rounds} 轮 ${r.phase === 'focus' ? '专注' : '休息'}( ${r.phase === 'focus' ? r.focus_min : r.rest_min} 分钟)`));
      body.appendChild(mkBtn('⏹ 结束番茄钟', async () => { await post('/api/pomodoro/stop'); openCtrl('pomo', '🍅 番茄钟'); }, 'mini-btn'));
    } else {
      const fI = mkInput('专注分钟(默认 25)', '25');

      body.appendChild(row('休息', rI));
      body.appendChild(row('轮数', nI));
      body.appendChild(mkBtn('▶ 开始专注', async () => {
        await post('/api/pomodoro/start', { focusMin: Number(fI.value), restMin: Number(rI.value), rounds: Number(nI.value) });
        openCtrl('pomo', '🍅 番茄钟');
      }));
    }
    sub.textContent = `🍅 今日 ${s.pomodoro.stats.today} 个 · 累计 ${s.pomodoro.stats.total} 个 · 累计专注 ${(s.pomodoro.stats.focusMinutes / 60).toFixed(1)} 小时`;
    body.appendChild(sub);
  } else if (id === 'weather') {
    const cI = mkInput('城市,如 沈阳 / 北京', s.weather.city);
    body.appendChild(row('城市', cI));
    body.appendChild(mkBtn('💾 保存城市', async () => { await post('/api/weather/config', { city: cI.value.trim() }); openCtrl('weather', '🌤 天气'); }));
    const tI = mkInput('推送时间 HH:MM', s.weather.time);
    body.appendChild(row('时间', tI));
    body.appendChild(mkBtn('💾 保存时间', async () => { await post('/api/weather/config', { time: tI.value.trim() }); openCtrl('weather', '🌤 天气'); }));
    body.appendChild(s.weather.enabled
      ? mkBtn('🔕 关闭每日推送', async () => { await post('/api/weather/config', { enabled: false }); openCtrl('weather', '🌤 天气'); }, 'mini-btn')
      : mkBtn('🔔 开启每日推送', async () => { await post('/api/weather/config', { enabled: true }); openCtrl('weather', '🌤 天气'); }));
  } else if (id === 'cd') {
    for (const c of s.countdowns) {
      const r = el('div', 'cd-item');
      r.appendChild(el('span', null, `${c.title}(${c.target})`));

        await fetch(`/api/countdowns/${c.id}`, { method: 'DELETE' });
        openCtrl('cd', '⏳ 倒计时');
      };
      r.appendChild(del);
      body.appendChild(r);
    }

    body.appendChild(row('日期', dI));
    body.appendChild(mkBtn('➕ 添加倒计时', async () => {

      await post('/api/schedule/config', { classRemind: !s.schedule.classRemind });

    body.appendChild(row('密钥', kI));

      openCtrl('pushbind', '🔔 手机推送');
    }));

      const gp5 = rows.reduce((a, b) => a + b.c * Math.max(0, Math.min(5, (b.s - 50) / 10)), 0) / totalC;

let resList = [];

function renderResources() {
  const box = $('#resourceView');

  search.className = 'search';
  search.placeholder = '搜索资源名称/描述…';

  // 管理员:添加按钮

    const tI = el('input'); tI.className = 'search'; tI.placeholder = '名称';
    const uI = el('input'); uI.className = 'search'; uI.placeholder = '网址 http(s)://…'; uI.style.flex = '2';
    const dI = el('input'); dI.className = 'search'; dI.placeholder = '简介(可选)';
    const addBtn = el('button', 'btn', '➕ 添加资源');
    addBtn.onclick = async () => {
      if (!cI.value.trim() || !tI.value.trim() || !uI.value.trim()) { alert('分类/名称/网址必填'); return; }
      const r = await fetch('/api/resources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: cI.value.trim(), title: tI.value.trim(), url: uI.value.trim(), description: dI.value.trim() }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || '添加失败'); return; }
      cI.value = tI.value = uI.value = dI.value = '';
      loadResources();
    };
    form.appendChild(cI); form.appendChild(tI); form.appendChild(uI); form.appendChild(dI); form.appendChild(addBtn);
    addBar.appendChild(form);
    box.appendChild(addBar);
  }

  // 资源卡片(按分类分组)
  const filtered = resList.filter((r) =>
    (resCat === '全部' || r.category === resCat) &&
    (!resQ || r.title.includes(resQ) || r.description.includes(resQ) || r.url.includes(resQ))
  );
  const byCat = {};
  for (const r of filtered) (byCat[r.category] ||= []).push(r);

  for (const cat of Object.keys(byCat)) {
    const card = el('div', 'card');
    card.appendChild(el('div', 'h2', `📚 ${cat}`));
    const grid = el('div', 'feat-grid');
    for (const r of byCat[cat]) {
      const a = el('a', 'feat', el('div', 'icon', '🔗'), el('div', 'name', r.title), el('div', 'desc', r.description || r.url), el('span', 'cmd', r.url.replace(/^https?:\/\//, '')));
      a.href = r.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.textDecoration = 'none';
      a.style.color = 'var(--text)';
      if (window.ME?.isAdmin) {
        const del = el('button', 'del', '✕');
        del.style.position = 'absolute';
        del.style.top = '6px';
        del.style.right = '6px';
        del.style.background = '#fff';
        del.onclick = async (ev) => {
          ev.preventDefault();
          if (!confirm(`删除「${r.title}」?`)) return;
          await fetch(`/api/resources/${r.id}`, { method: 'DELETE' });
          loadResources();
        };
        a.style.position = 'relative';
        a.appendChild(del);
      }
      grid.appendChild(a);
    }
    card.appendChild(grid);
    box.appendChild(card);
  }

  if (!filtered.length) box.appendChild(el('div', 'card pre', '没有匹配的资源。'));
}

  ta.placeholder = '说点什么…(问问题 / 找队友 / 失物招领 / 二手)';
  ta.rows = 2;
  ta.style.width = '100%';
  ta.style.resize = 'vertical';
  const btnRow = el('div', 'toolbar');
  btnRow.style.marginTop = '8px';
  btnRow.style.justifyContent = 'flex-end';
  const pub = el('button', 'btn', '发布');
  pub.onclick = async () => {
    const content = ta.value.trim();
    if (!content) return;
    const r = await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (r.ok) { ta.value = ''; loadBoard(); }
  };
  btnRow.appendChild(pub);
  composer.appendChild(ta);
  composer.appendChild(btnRow);
  box.appendChild(composer);

  if (!posts.length) {
    box.appendChild(el('div', 'card pre', '还没有留言,来抢沙发吧 🛋'));
    return;
  }
  for (const p of posts) {
    const card = el('div', 'card');
    const head = el('div', 's-head');
    const who = el('b', 'who', `👤 ${p.name || '同学'}`);
    const time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const headR = el('span', 'sub', time);
    head.appendChild(who);
    head.appendChild(headR);
    card.appendChild(head);
    card.appendChild(el('div', 't-title', p.content));
    if (p.mine) {
      const del = el('button', 'mini-btn', '删除');
      del.style.marginTop = '8px';
      del.onclick = async () => {
        if (!confirm('删除这条留言?')) return;
        await fetch(`/api/posts/${p.id}`, { method: 'DELETE' });
        loadBoard();
      };
      card.appendChild(del);
    }
    box.appendChild(card);
  }
}

/* ================= 设置视图 ================= */
async function loadSettings() {
  try {
    const s = await fetch('/api/settings').then((r) => r.json());
    renderSettings(s);
  } catch {}
}

function renderSettings(s) {
  const box = $('#settingsView');
  box.innerHTML = '';
  const frag = document.createDocumentFragment();

  const srow = (icon, name, val, onClick) => {
    const r = el('div', 'set-row');
    r.appendChild(el('span', 'sicon', icon));
    r.appendChild(el('span', 'sname', name));
    if (val) r.appendChild(el('span', 'sval', val));
    r.appendChild(el('span', 'arrow', '›'));
    if (onClick) r.onclick = onClick;
    return r;
  };
  const scard = (title) => {
    const c = el('div', 'card');
    c.appendChild(el('div', 'h2', title));
    return c;
  };

  // 账号
  const acc = scard('👤 账号');
  const meName = window.ME?.isAdmin ? '管理员' : (window.ME?.name || '同学');
  acc.appendChild(srow('🆔', '当前身份', meName, null));
  acc.appendChild(srow('↩️', '退出登录', '', () => { localStorage.removeItem('token'); localStorage.removeItem('me'); location.reload(); }));
  frag.appendChild(acc);

  // 消息推送
  const push = scard('🔔 消息推送');
  getPushState().then((st) => {
    push.appendChild(srow('📲', '原生推送(Web Push)', st.state === 'on' ? '已开启 ✓' : st.state === 'denied' ? '权限被拒' : st.state === 'unsupported' ? '设备不支持' : '未开启', () => { if (st.state === 'on') disablePush(); else if (st.state !== 'denied' && st.state !== 'unsupported') enablePush(); }));
    push.appendChild(srow('📱', '手机推送(Bark/PushDeer)', s.push.kind ? `${s.push.kind === 'bark' ? 'Bark' : 'PushDeer'} 已绑定` : '未绑定', () => openCtrl('pushbind', '🔔 手机推送')));
    frag.appendChild(push);
  });

  // 课表与提醒
  const rem = scard('⏰ 课表与提醒');
  rem.appendChild(srow('🌅', '课表提醒时间', s.schedule.notifyTime, () => openCtrl('remind', '⏰ 提醒设置')));
  rem.appendChild(srow('🔔', '上课前提醒', s.schedule.classRemind ? `课前 ${s.schedule.classRemindMinutes} 分钟` : '已关闭', () => openCtrl('remind', '⏰ 提醒设置')));
  rem.appendChild(srow('🌙', '睡觉提醒', s.schedule.sleepTime || '未设置', () => openCtrl('remind', '⏰ 提醒设置')));
  rem.appendChild(srow('📅', '开学日期', s.schedule.semesterStart || '未设置', () => openCtrl('remind', '⏰ 提醒设置')));
  frag.appendChild(rem);

  // 天气
  const wea = scard('🌤 天气');
  wea.appendChild(srow('🏙', '城市', s.weather.city, () => openCtrl('weather', '🌤 天气')));
  wea.appendChild(srow('🕖', '推送时间', s.weather.time, () => openCtrl('weather', '🌤 天气')));
  wea.appendChild(srow('🔔', '每日推送', s.weather.enabled ? '开启' : '关闭', () => openCtrl('weather', '🌤 天气')));
  frag.appendChild(wea);

  // 番茄与倒计时
  const misc = scard('🍅 效率');
  misc.appendChild(srow('🍅', '番茄钟', s.pomodoro.running ? `进行中 ${s.pomodoro.running.round}/${s.pomodoro.running.rounds} 轮` : `今日 ${s.pomodoro.stats.today} 个`, () => openCtrl('pomo', '🍅 番茄钟')));
  misc.appendChild(srow('⏳', '倒计时', `${s.countdowns.length} 个`, () => openCtrl('cd', '⏳ 倒计时')));
  misc.appendChild(srow('📦', '快递', '', () => openCtrl('pkg', '📦 快递')));
  frag.appendChild(misc);

  // 服务器
  const srv = scard('⚙️ 服务器');
  const sInput = el('input');
  sInput.className = 'search';
  sInput.placeholder = '如 http://182.92.163.6:8080';
  sInput.value = BASE || '';
  const row = el('div', 'toolbar');
  row.appendChild(sInput);
  const saveBtn = el('button', 'mini-btn', '保存');
  saveBtn.onclick = () => {
    const v = sInput.value.trim().replace(/\/+$/, '');
    if (v) localStorage.setItem('server', v);
    else localStorage.removeItem('server');
    location.reload();
  };
  row.appendChild(saveBtn);
  srv.appendChild(row);
  frag.appendChild(srv);

  // 管理员:备份
  if (window.ME?.isAdmin) {
    const bk = scard('💾 数据');
    const a = el('a', 'set-row', el('span', 'sicon', '💾'), el('span', 'sname', '下载数据备份'), el('span', 'sval', '云端每日自动备份'), el('span', 'arrow', '›'));
    a.href = `${BASE}/api/backup?token=${encodeURIComponent(AUTH)}`;
    a.style.textDecoration = 'none';
    a.style.color = 'var(--text)';
    bk.appendChild(a);
    frag.appendChild(bk);
  }

  box.appendChild(frag);
}

/* ================= 课表视图 ================= */
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const fmtMin = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

document.querySelectorAll('.vtab').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.vtab').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    const v = btn.dataset.v;
    $('#homeView').style.display = v === 'home' ? '' : 'none';
    $('#todoView').style.display = v === 'todo' ? '' : 'none';
    $('#scheduleView').style.display = v === 'sched' ? '' : 'none';
    $('#resourceView').style.display = v === 'res' ? '' : 'none';
    $('#boardView').style.display = v === 'board' ? '' : 'none';
    $('#settingsView').style.display = v === 'settings' ? '' : 'none';
    if (v === 'home') loadHome();
    if (v === 'sched') loadSchedule();
    if (v === 'res') loadResources();
    if (v === 'board') loadBoard();
    if (v === 'settings') loadSettings();
  };
});

async function loadSchedule() {
  try {
    const res = await fetch('/api/schedule');
    const data = await res.json();
    renderSchedule(data.users || [], data.weather);
  } catch {}
}

function renderSchedule(users, weather) {
  const box = $('#scheduleView');
  box.innerHTML = '';

  // 上传课表文件导入(iOS/安卓/电脑通用)
  const isAdmin = window.ME?.isAdmin;
  const up = el('div', 'card');
  up.appendChild(el('div', 'h2', '📥 导入课表文件(教务系统导出的 xlsx)'));
  const row = el('div', 'toolbar');
  let ownerInp = null;
  if (isAdmin) {
    ownerInp = el('input');
    ownerInp.className = 'search';
    ownerInp.placeholder = '导入到哪个 QQ 号(如 1487138742)';
    ownerInp.value = localStorage.getItem('importOwner') || '1487138742';
  }
  const fileInp = el('input');
  fileInp.type = 'file';
  fileInp.accept = '.xlsx,.xls';
  fileInp.style.display = 'none';
  const pick = el('button', 'btn', '选择文件');
  pick.onclick = () => fileInp.click();
  fileInp.onchange = async () => {
    const f = fileInp.files[0];
    if (!f) return;
    if (isAdmin) localStorage.setItem('importOwner', ownerInp.value.trim());
    pick.textContent = '导入中…';
    pick.disabled = true;
    try {
      const buf = await f.arrayBuffer();
      const q = isAdmin ? `?owner=qq:${encodeURIComponent(ownerInp.value.trim())}` : '';
      const res = await fetch(`/api/schedule/import${q}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: buf,
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok) { alert(`✅ 导入成功,共 ${d.count} 节课`); loadSchedule(); }
      else alert(`❌ 导入失败:${d.error || res.status}`);
    } catch (e) {
      alert('导入出错:' + e.message);
    }
    pick.textContent = '选择文件';
    pick.disabled = false;
    fileInp.value = '';
  };
  if (ownerInp) row.appendChild(ownerInp);
  row.appendChild(pick);
  row.appendChild(el('span', 'live', '支持东北大学教务导出的 xlsx,自动识别节次/周次/教室'));
  up.appendChild(row);
  box.appendChild(up);

  if (!users.length) {
    const w = weather?.city ? `\n管理员已配置天气推送:${weather.city} 每天 ${weather.notifyTime}` : '';
    box.appendChild(el('div', 'card pre', `还没有学生提交课表。\n让学生给机器人私聊发送课表,或在上方直接上传课表文件。\n\n课表\n周一 08:00-09:40 高等数学 @一教101\n周一 10:00-11:40 大学英语 1-16周\n周二 14:00-15:40 物理实验 双周\n\n每天 21:00 机器人会私聊提醒学生第二天的课程。${w}`));
    return;
  }
  for (const u of users) {
    const card = el('div', 'card');
    const head = el('div', 's-head');
    head.appendChild(el('b', 'who', u.name || u.owner));
    const meta = [];
    if (u.semester_start) meta.push(`开学 ${u.semester_start}`);
    if (u.currentWeek) meta.push(`第${u.currentWeek}周`);
    meta.push(`提醒 ${u.notify_time || '21:00'}`);
    meta.push(u.push_kind ? `推送 ${u.push_kind === 'bark' ? 'Bark' : 'PushDeer'}` : '未绑推送');
    meta.push(`🍅今日 ${u.pomodoroToday || 0}`);
    head.appendChild(el('span', 'sub', `${u.owner} · ` + meta.join(' · ')));
    card.appendChild(head);

    const days = {};
    u.items.forEach((it) => { (days[it.day] ||= []).push(it); });
    for (const wd of [1, 2, 3, 4, 5, 6, 0]) {
      const arr = (days[wd] || []).slice().sort((a, b) => a.start_min - b.start_min);
      if (!arr.length) continue;
      const dl = el('div', 's-day');
      dl.appendChild(el('div', 's-dayname', WD[wd] + ` (${arr.length}节)`));
      for (const it of arr) {
        const row = el('div', 's-item');
        let label = `${fmtMin(it.start_min)}-${fmtMin(it.end_min)} ${it.name}`;
        if (it.location) label += ` @${it.location}`;
        row.appendChild(el('span', 't', label));
        const wl = [];
        if (it.week_start && it.week_end) wl.push(it.week_start === it.week_end ? `${it.week_start}周` : `${it.week_start}-${it.week_end}周`);
        if (it.parity === 'odd') wl.push('单周');
        if (it.parity === 'even') wl.push('双周');
        if (wl.length) row.appendChild(el('span', 's-week', wl.join(' ')));
        const del = el('button', 'del', '✕');
        del.title = '删除这节课';
        del.onclick = async () => {
          if (!confirm('删除这节课?')) return;
          await fetch(`/api/schedule/item/${it.id}`, { method: 'DELETE' });
          loadSchedule();
        };
        row.appendChild(del);
        dl.appendChild(row);
      }
      card.appendChild(dl);
    }

    const actions = el('div', 's-actions');
    if (isAdmin) {
      const clearBtn = el('button', 'mini-btn', '清空该学生课表');
      clearBtn.onclick = async () => {
        if (!confirm(`确定清空「${u.name || u.owner}」的课表?`)) return;
        await fetch(`/api/schedule/${encodeURIComponent(u.owner)}`, { method: 'DELETE' });
        loadSchedule();
      };
      actions.appendChild(clearBtn);
      card.appendChild(actions);
    }
    box.appendChild(card);
  }
}
</script>
