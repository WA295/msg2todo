<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>校园生活管家 · msg2todo</title>
<meta name="theme-color" content="#4f6ef7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办助手">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e5e7eb;
    --text: #1f2937; --muted: #6b7280;
    --accent: #4f6ef7; --accent-soft: #eef1fe;
    --high: #ef4444; --mid: #f59e0b; --low: #10b981;
    --wx: #07c160; --qq: #12b7f5; --manual: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 22px; }
  header h1 .dot { color: var(--accent); }
  .head-right { display: flex; align-items: center; gap: 14px; }
  .conns { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: #fff; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .chip b { font-weight: 600; color: var(--text); }
  .chip .light { width: 7px; height: 7px; border-radius: 50%; background: #c3c8d1; }
  .chip.ok .light { background: #22c55e; }
  .chip.warn .light { background: #f59e0b; }
  .stats { font-size: 13px; color: var(--muted); }
  .stats b { color: var(--accent); font-size: 15px; margin: 0 2px; }
  .stats b.hot { color: var(--high); }
  .mini-btn { border: 1px solid var(--line); background: #fff; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text); }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: #eef0f3; padding: 3px; border-radius: 10px; }
  .tab { border: none; background: transparent; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .tab.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search { flex: 1; min-width: 160px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; outline: none; }
  .search:focus { border-color: var(--accent); }

  form.add { display: grid; grid-template-columns: 1fr 130px 110px 110px auto; gap: 8px; align-items: center; }
  form.add input, form.add select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; outline: none; background: #fff; }
  form.add input:focus, form.add select:focus { border-color: var(--accent); }
  .btn { border: none; background: var(--accent); color: #fff; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { opacity: .9; }

  .list { list-style: none; }
  .todo { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; transition: opacity .15s; }
  .todo.done { opacity: .55; }
  .todo.done .t-title { text-decoration: line-through; }
  input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .t-main { flex: 1; min-width: 0; }
  .t-title { font-size: 15px; word-break: break-all; }
  .t-meta { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
  .b-high { background: #fee2e2; color: var(--high); }
  .b-mid { background: #fef3c7; color: var(--mid); }
  .b-low { background: #d1fae5; color: var(--low); }
  .b-wx { background: #e3f9ec; color: #0a7d43; }
  .b-qq { background: #e0f4fd; color: #0b7eab; }
  .b-manual { background: #f0f1f3; color: var(--muted); }
  .due { font-weight: 600; }
  .due.overdue { color: var(--high); }
  .t-notes { margin-top: 6px; font-size: 12.5px; color: var(--muted); background: #f8f9fb; border-radius: 6px; padding: 6px 10px; word-break: break-all; }
  .del { border: none; background: transparent; color: #c3c8d1; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; }
  .del:hover { color: var(--high); background: #fef2f2; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }

  .vtabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .vtab { border: 1px solid var(--line); background: #fff; padding: 9px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .vtab.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; box-shadow: 0 2px 8px rgba(79,110,247,.25); }

  /* 总览首页 */
  .h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 2px 10px; letter-spacing: .5px; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px; text-align: center; }
  .stat-card .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-card .lbl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .feat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px; cursor: pointer; transition: all .12s; }
  .feat:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(79,110,247,.12); }
  .feat .icon { font-size: 24px; }
  .feat .name { font-size: 14px; font-weight: 600; margin-top: 8px; }
  .feat .desc { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; word-break: break-all; }
  .feat .cmd { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-top: 7px; display: inline-block; }
  .tl { list-style: none; }
  .tl li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13.5px; border-radius: 8px; }
  .tl li:nth-child(odd) { background: #f8f9fb; }
  .tl .t { font-weight: 600; color: var(--accent); min-width: 96px; }
  .weather-box { background: linear-gradient(135deg, #4f6ef7 0%, #6a8bff 100%); color: #fff; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .weather-box .w-lines { font-size: 13.5px; line-height: 1.9; opacity: .96; white-space: pre-line; }
  .tom-cls { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13.5px; border-radius: 8px; }
  .tom-cls:nth-child(odd) { background: #f8f9fb; }
  .tom-cls .tm { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .cd-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13.5px; border-radius: 8px; }
  .cd-item:nth-child(odd) { background: #f8f9fb; }
  .cd-item .d { font-weight: 700; color: var(--high); white-space: nowrap; }
  .cheat { font-size: 12.5px; line-height: 1.9; color: var(--text); }
  .cheat code { background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  @media (max-width: 640px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .feat-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .s-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .s-head .who { font-size: 15px; }
  .s-head .sub { font-size: 12px; color: var(--muted); }
  .s-day { margin-bottom: 12px; }
  .s-dayname { font-size: 12.5px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .s-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; font-size: 13.5px; border-radius: 8px; }
  .s-item:nth-child(odd) { background: #f8f9fb; }
  .s-item .t { flex: 1; min-width: 0; word-break: break-all; }
  .s-week { font-size: 11px; color: var(--muted); background: #eef0f3; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .card.pre { white-space: pre-line; }
  .s-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

  .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #c3c8d1; display: inline-block; }
  .live.on i { background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-card { background: #fff; border-radius: 16px; padding: 26px 34px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-card h3 { font-size: 17px; margin-bottom: 6px; }
  .modal-card .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .qr-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: inline-block; }
  .qr-box img { display: block; width: 220px; height: 220px; }
  .modal-card .btn { margin-top: 14px; }
  .qr-hint { font-size: 13px; color: var(--accent); margin-top: 10px; }
  @media (max-width: 720px) {
    form.add { grid-template-columns: 1fr 1fr; }
    form.add .btn { grid-column: span 2; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 12px 10px 70px; }
    header { margin-bottom: 12px; }
    header h1 { font-size: 18px; }
    .head-right { width: 100%; justify-content: space-between; gap: 8px; }
    .chip { padding: 2px 8px; font-size: 11px; }
    .stats { font-size: 12px; }
    .card { padding: 12px; margin-bottom: 10px; border-radius: 10px; }
    .todo { padding: 12px; margin-bottom: 8px; border-radius: 10px; }
    .t-title { font-size: 14.5px; }
    .del { font-size: 20px; padding: 6px 10px; }
    .modal-card { margin: 16px; padding: 22px 26px; }
    .mini-btn { padding: 5px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot">●</span> 校园生活管家</h1>
    <div class="head-right">
      <div class="conns" id="conns"></div>
      <button class="mini-btn" id="wxBtn">微信登录</button>
      <button class="mini-btn" id="setBtn">⚙️ 服务器</button>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <div class="vtabs">
    <button class="vtab on" data-v="home">🏠 总览</button>
    <button class="vtab" data-v="todo">📝 待办</button>
    <button class="vtab" data-v="sched">📚 课表</button>
  </div>

  <div id="homeView"></div>

  <div id="todoView" style="display:none">
    <div class="card">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab on" data-f="open">未完成</button>
          <button class="tab" data-f="done">已完成</button>
          <button class="tab" data-f="all">全部</button>
        </div>
        <input class="search" id="search" placeholder="搜索标题 / 备注 / 来源…" />
        <span class="live" id="live"><i></i><span id="liveText">已连接</span></span>
      </div>
    </div>

    <div class="card">
      <form class="add" id="addForm">
        <input id="fTitle" placeholder="手动添加待办…" required />
        <input id="fDue" type="datetime-local" />
        <select id="fPriority">
          <option value="medium">中优先级</option>
          <option value="high">高优先级</option>
          <option value="low">低优先级</option>
        </select>
        <input id="fNotes" placeholder="备注(可选)" />
        <button class="btn" type="submit">添加</button>
      </form>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" style="display:none">暂无待办 🎉</div>
  </div>

  <div id="scheduleView" style="display:none"></div>
</div>

<div class="modal" id="qrModal" style="display:none">
  <div class="modal-card">
    <h3>📱 微信扫码登录</h3>
    <div class="sub">打开手机微信 → 扫一扫</div>
    <div class="qr-box"><img id="qrImg" alt="微信登录二维码"></div>
    <div class="qr-hint" id="qrHint">二维码加载中…</div>
    <button class="btn" id="qrClose">关闭</button>
  </div>
</div>

<div class="modal" id="setModal" style="display:none">
  <div class="modal-card" style="text-align:left; min-width:min(340px, 90vw)">
    <h3 style="text-align:center">⚙️ 服务器设置</h3>
    <div class="sub" style="text-align:center">填写 msg2todo 服务所在地址(手机 App 必填)</div>
    <input id="setServer" placeholder="如 http://192.168.1.100:8080" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; outline:none" />
    <div style="display:flex; gap:10px; margin-top:14px">
      <button class="btn" id="setSave" style="flex:1">保存并刷新</button>
      <button class="mini-btn" id="setClose" style="flex:0">取消</button>
    </div>
    <div class="sub" style="margin-top:12px">留空 = 使用打开页面自身的地址(PWA 模式)。手机 App 与电脑需同一网络,或填云端服务器地址。</div>
  </div>
</div>

<div class="modal" id="authModal" style="display:none">
  <div class="modal-card" style="text-align:left; min-width:min(340px, 90vw)">
    <h3 style="text-align:center">🔒 需要访问密码</h3>
    <div class="sub" style="text-align:center">该服务器开启了访问保护,请输入密码</div>
    <input id="authToken" type="password" placeholder="访问密码" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; outline:none" />
    <div style="display:flex; gap:10px; margin-top:14px">
      <button class="btn" id="authSave" style="flex:1">进入</button>
    </div>
  </div>
</div>

<script src="app-config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const PRIO = { high: ['高', 'b-high'], medium: ['中', 'b-mid'], low: ['低', 'b-low'] };
const SRC = { wechat: ['微信', 'b-wx'], qq: ['QQ', 'b-qq'], manual: ['手动', 'b-manual'] };
let filter = 'open';
let q = '';

/* ---- 服务器地址:手动配置 > 打包内置 > 当前页面自身 ---- */
const inApp = location.hostname === 'localhost' || location.protocol === 'capacitor:';
let BASE = (localStorage.getItem('server') || '').replace(/\/+$/, '');
if (!BASE && inApp) {
  BASE = (window.APP_CONFIG?.server || '').replace(/\/+$/, '');
}
let AUTH = (localStorage.getItem('token') || window.APP_CONFIG?.authToken || '').trim();
const rawFetch = window.fetch;
window.fetch = (input, init) => {
  const url = typeof input === 'string' && input.startsWith('/') ? BASE + input : input;
  init = init || {};
  if (AUTH) init.headers = { ...(init.headers || {}), 'x-auth-token': AUTH };
  return rawFetch(url, init).then((res) => {
    if (res.status === 401) $('#authModal').style.display = 'flex';
    return res;
  });
};

// 访问密码弹窗
$('#authSave').onclick = () => {
  localStorage.setItem('token', $('#authToken').value.trim());
  location.reload();
};
$('#authToken').onkeydown = (e) => { if (e.key === 'Enter') $('#authSave').click(); };

// 服务器设置弹窗(仅当没有可用地址时自动弹出)
$('#setBtn').onclick = () => {
  $('#setModal').style.display = 'flex';
  $('#setServer').value = localStorage.getItem('server') || BASE || '';
};
$('#setClose').onclick = () => { $('#setModal').style.display = 'none'; };
$('#setSave').onclick = () => {
  const v = $('#setServer').value.trim().replace(/\/+$/, '');
  if (v) localStorage.setItem('server', v);
  else localStorage.removeItem('server');
  location.reload();
};
if (inApp && !BASE) $('#setModal').style.display = 'flex';

async function load() {
  const res = await fetch(`/api/todos?status=${filter}&q=${encodeURIComponent(q)}`);
  const data = await res.json();
  const s = data.stats;
  $('#stats').innerHTML = `共 <b>${s.total}</b> 项 · 未完成 <b class="hot">${s.open}</b> 项`;
  render(data.todos);
}

function fmtDue(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const same = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const now = new Date(), tom = new Date(Date.now()+86400000);
  if (same(d, now)) return { label: `今天 ${hm}`, overdue: d < now };
  if (same(d, tom)) return { label: `明天 ${hm}`, overdue: false };
  const base = `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
  return { label: d.getFullYear() === now.getFullYear() ? base : `${d.getFullYear()}年${base}`, overdue: d < now };
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function render(todos) {
  const list = $('#list');
  list.innerHTML = '';
  $('#empty').style.display = todos.length ? 'none' : 'block';
  const frag = document.createDocumentFragment();
  for (const t of todos) {
    const li = el('li', 'todo' + (t.status === 'done' ? ' done' : ''));
    const cb = el('input');
    cb.type = 'checkbox';
    cb.checked = t.status === 'done';
    cb.onchange = () => toggle(t.id);
    const main = el('div', 't-main');
    main.appendChild(el('div', 't-title', t.title));
    const meta = el('div', 't-meta');
    const [pn, pc] = PRIO[t.priority] || PRIO.medium;
    meta.appendChild(el('span', `badge ${pc}`, pn + '优先级'));
    const [sn, sc] = SRC[t.source] || ['其他', 'b-manual'];
    meta.appendChild(el('span', `badge ${sc}`, sn));
    if (t.due_at) {
      const f = fmtDue(t.due_at);
      if (f) meta.appendChild(el('span', `due${f.overdue && t.status==='open' ? ' overdue' : ''}`, '⏰ ' + f.label));
    }
    const from = [t.chat_name, t.sender_name].filter(Boolean).join(' · ');
    if (from) meta.appendChild(el('span', null, '来自 ' + from));
    main.appendChild(meta);
    if (t.notes) main.appendChild(el('div', 't-notes', t.notes));
    li.appendChild(cb);
    li.appendChild(main);
    const del = el('button', 'del', '✕');
    del.title = '删除';
    del.onclick = () => remove(t.id);
    li.appendChild(del);
    frag.appendChild(li);
  }
  list.appendChild(frag);
}

async function toggle(id) { await fetch(`/api/todos/${id}/toggle`, { method: 'POST' }); load(); }
async function remove(id) {
  if (!confirm('确定删除这条待办?')) return;
  await fetch(`/api/todos/${id}`, { method: 'DELETE' });
  load();
}

document.querySelectorAll('.tab').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    filter = btn.dataset.f;
    load();
  };
});
let searchTimer;
$('#search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { q = e.target.value.trim(); load(); }, 250);
};
$('#addForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = {
    title: $('#fTitle').value.trim(),
    dueLocal: $('#fDue').value,
    priority: $('#fPriority').value,
    notes: $('#fNotes').value.trim(),
  };
  await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  $('#addForm').reset();
  load();
};

// SSE 实时更新(浏览器断线自动重连),另加 30s 兜底轮询
function connectSSE() {
  const es = new EventSource(BASE + '/api/events' + (AUTH ? `?token=${encodeURIComponent(AUTH)}` : ''));
  es.addEventListener('update', () => { load(); loadSchedule(); loadHome(); });
  es.addEventListener('status', (e) => renderStatus(JSON.parse(e.data)));
  es.addEventListener('qr', (e) => {
    const d = JSON.parse(e.data);
    if (d.hasQr) showQr();
    else if (!$('#qrModal').dataset.manual) hideQr();
  });
  es.onopen = () => { $('#live').classList.add('on'); $('#liveText').textContent = '实时连接中'; };
  es.onerror = () => { $('#live').classList.remove('on'); $('#liveText').textContent = '重连中…'; };
}

function chip(key, label, ok) {
  const c = el('span', 'chip' + (ok ? ' ok' : ''));
  c.appendChild(el('span', 'light'));
  c.appendChild(el('b', null, label));
  return c;
}

function renderStatus(s) {
  const box = $('#conns');
  box.innerHTML = '';
  if (!s.wechatEnabled) {
    box.appendChild(chip('wechat', '微信 · 已停用', false));
  } else if (s.wechat === 'on') {
    box.appendChild(chip('wechat', `微信 · ${s.wechatName || '已登录'}`, true));
    if (!$('#qrModal').dataset.manual) hideQr();
  } else if (s.wechat === 'scanning') {
    box.appendChild(chip('wechat', '微信 · 扫码中', false));
  } else {
    box.appendChild(chip('wechat', '微信 · 未连接', false));
  }
  box.appendChild(chip('qq', s.qq === 'on' ? 'QQ · 已连接' : 'QQ · 未连接', s.qq === 'on'));
  box.appendChild(chip('llm', s.llm ? 'LLM · 已启用' : 'LLM · 规则模式', Boolean(s.llm)));
  $('#wxBtn').style.display = s.wechatEnabled ? '' : 'none';
}

function showQr() {
  $('#qrModal').style.display = 'flex';
  $('#qrImg').src = `${BASE}/api/qr.svg?t=${Date.now()}`;
  $('#qrHint').textContent = '扫描成功后自动关闭';
}
function hideQr() {
  $('#qrModal').style.display = 'none';
  delete $('#qrModal').dataset.manual;
}
$('#qrClose').onclick = () => { hideQr(); };
$('#wxBtn').onclick = () => {
  $('#qrModal').dataset.manual = '1';
  fetch('/api/status').then((r) => r.json()).then((s) => {
    if (s.wechat === 'on') {
      $('#qrModal').style.display = 'flex';
      $('#qrImg').src = '';
      $('#qrHint').textContent = '微信已登录 ✔';
    } else {
      showQr();
    }
  });
};

connectSSE();
setInterval(() => { load(); loadHome(); }, 30000);
fetch('/api/status').then((r) => r.json()).then(renderStatus);
load();

/* ================= 总览首页 ================= */
const VWD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const vfmtMin = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

async function loadHome() {
  try {
    const res = await fetch('/api/overview');
    const d = await res.json();
    renderHome(d);
  } catch {}
}

function vcard(cls, ...children) {
  const n = el('div', cls);
  for (const c of children) if (c) n.appendChild(c);
  return n;
}

function renderHome(d) {
  const box = $('#homeView');
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  if (!d) { box.appendChild(el('div', 'card', '加载中…')); return; }

  // 天气
  if (d.weather) {
    const w = el('div', 'weather-box');
    w.appendChild(el('div', 'w-lines', d.weather));
    frag.appendChild(w);
  }

  // 统计行
  const srow = el('div', 'stats-row');
  const st = (num, lbl) => {
    const c = vcard('stat-card', el('div', 'num', String(num)), el('div', 'lbl', lbl));
    srow.appendChild(c);
    return c;
  };
  st(d.stats.open, '待办未完成');
  st(d.users.reduce((a, u) => a + u.today.length, 0), '今日课程');
  st(d.users.reduce((a, u) => a + u.pomodoroToday, 0), '🍅 今日番茄');
  st(d.countdowns.length, '⏳ 倒计时');
  frag.appendChild(srow);

  // 明日课程
  const tcard = el('div', 'card');
  tcard.appendChild(el('div', 'h2', '🌅 明天课程'));
  const tomAll = [];
  d.users.forEach((u) => u.tomorrow.forEach((it) => tomAll.push({ u, it })));
  tomAll.sort((a, b) => a.it.start_min - b.it.start_min);
  if (!tomAll.length) {
    tcard.appendChild(el('div', 'empty', '明天没有课,好好休息~ 🎉'));
  } else {
    for (const { u, it } of tomAll) {
      const row = el('div', 'tom-cls');
      row.appendChild(el('span', 'tm', vfmtMin(it.start_min)));
      row.appendChild(el('span', null, `${it.name}${it.location ? ` @${it.location}` : ''}`));
      row.appendChild(el('span', 's-week', u.name || u.owner));
      tcard.appendChild(row);
    }
  }
  frag.appendChild(tcard);

  // 倒计时
  if (d.countdowns.length) {
    const ccard = el('div', 'card');
    ccard.appendChild(el('div', 'h2', '⏳ 倒计时'));
    for (const c of d.countdowns) {
      const row = el('div', 'cd-item');
      row.appendChild(el('span', null, c.title));
      const left = c.daysLeft < 0 ? `已过 ${-c.daysLeft} 天` : c.daysLeft === 0 ? '就是今天!' : `还有 ${c.daysLeft} 天`;
      row.appendChild(el('span', 'd', left));
      ccard.appendChild(row);
    }
    frag.appendChild(ccard);
  }

  // 自动化时间表
  const tcard2 = el('div', 'card');
  tcard2.appendChild(el('div', 'h2', '🤖 自动化时间表'));
  const tl = el('ul', 'tl');
  const rows = [];
  if (d.scheduleTimes.weather) rows.push(['每日', d.scheduleTimes.weather, '天气推送']);
  rows.push(['每日', d.scheduleTimes.countdown, '倒计时推送']);
  rows.push(['课前', `${d.scheduleTimes.classRemind} 分钟`, '上课提醒']);
  rows.push(['每晚', d.scheduleTimes.schedule, '明天课表提醒']);
  rows.push(['周日', d.scheduleTimes.weeklyReview, '每周回顾']);
  for (const s of d.scheduleTimes.sleep) rows.push(['就寝', s.time, `睡觉提醒(${s.name})`]);
  for (const [t, v, label] of rows) {
    const li = el('li');
    li.appendChild(el('span', 't', t));
    li.appendChild(el('span', null, v));
    li.appendChild(el('span', null, label));
    tl.appendChild(li);
  }
  tcard2.appendChild(tl);
  frag.appendChild(tcard2);

  // 功能入口
  const fcard = el('div', 'card');
  fcard.appendChild(el('div', 'h2', '🧭 功能入口'));
  const grid = el('div', 'feat-grid');
  const feats = [
    { icon: '📝', name: '待办', desc: '聊天消息自动提取 / 手动添加', cmd: '发消息即可', v: 'todo' },
    { icon: '📚', name: '课表', desc: '发文本或 xlsx 文件导入,每晚提醒', cmd: '课表 / 发文件', v: 'sched' },
    { icon: '🍅', name: '番茄钟', desc: '专注计时,到点提醒', cmd: '番茄 25 5 4', v: null },
    { icon: '🌤', name: '天气', desc: '每日天气+带伞提示', cmd: '设置天气 城市', v: null },
    { icon: '⏳', name: '倒计时', desc: '考试/放假天数提醒', cmd: '倒计时 12月12日 四六级', v: null },
    { icon: '📊', name: '每周回顾', desc: '周日自动总结本周', cmd: '自动推送', v: null },
    { icon: '🌙', name: '睡觉提醒', desc: '到点提醒,早八加提示', cmd: '睡觉提醒 23:00', v: null },
    { icon: '🔔', name: '手机推送', desc: d.status.bark ? 'Bark 已绑定 ✓' : '未绑定推送', cmd: d.status.bark ? '已推送至手机' : '设置推送 <key>', v: null },
  ];
  for (const f of feats) {
    const c = vcard('feat', el('div', 'icon', f.icon), el('div', 'name', f.name), el('div', 'desc', f.desc), el('span', 'cmd', f.cmd));
    if (f.v) c.onclick = () => { document.querySelector(`.vtab[data-v="${f.v}"]`).click(); };
    grid.appendChild(c);
  }
  fcard.appendChild(grid);
  frag.appendChild(fcard);

  // 指令速查
  const cheat = el('div', 'card');
  cheat.appendChild(el('div', 'h2', '💬 指令速查(私聊机器人)'));
  cheat.appendChild(el('div', 'cheat', `<code>课表帮助</code> <code>我的课表</code> <code>明天什么课</code> <code>番茄 25</code> <code>天气</code> <code>设置天气 沈阳</code> <code>倒计时 12月12日 四六级</code> <code>睡觉提醒 23:00</code> <code>设置推送 &lt;key&gt;</code> <code>开学日期 2026-02-23</code>`));
  frag.appendChild(cheat);

  box.appendChild(frag);
}

/* ================= 课表视图 ================= */
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const fmtMin = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

document.querySelectorAll('.vtab').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.vtab').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    const v = btn.dataset.v;
    $('#homeView').style.display = v === 'home' ? '' : 'none';
    $('#todoView').style.display = v === 'todo' ? '' : 'none';
    $('#scheduleView').style.display = v === 'sched' ? '' : 'none';
    if (v === 'home') loadHome();
    if (v === 'sched') loadSchedule();
  };
});

loadHome();

async function loadSchedule() {
  try {
    const res = await fetch('/api/schedule');
    const data = await res.json();
    renderSchedule(data.users || [], data.weather);
  } catch {}
}

function renderSchedule(users, weather) {
  const box = $('#scheduleView');
  box.innerHTML = '';

  // 上传课表文件导入(iOS/安卓/电脑通用)
  const up = el('div', 'card');
  up.appendChild(el('div', 'h2', '📥 导入课表文件(教务系统导出的 xlsx)'));
  const row = el('div', 'toolbar');
  const ownerInp = el('input');
  ownerInp.className = 'search';
  ownerInp.placeholder = '导入到哪个 QQ 号(如 1487138742)';
  ownerInp.value = localStorage.getItem('importOwner') || '1487138742';
  const fileInp = el('input');
  fileInp.type = 'file';
  fileInp.accept = '.xlsx,.xls';
  fileInp.style.display = 'none';
  const pick = el('button', 'btn', '选择文件');
  pick.onclick = () => fileInp.click();
  fileInp.onchange = async () => {
    const f = fileInp.files[0];
    if (!f) return;
    localStorage.setItem('importOwner', ownerInp.value.trim());
    pick.textContent = '导入中…';
    pick.disabled = true;
    try {
      const buf = await f.arrayBuffer();
      const res = await fetch(`/api/schedule/import?owner=qq:${encodeURIComponent(ownerInp.value.trim())}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: buf,
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok) { alert(`✅ 导入成功,共 ${d.count} 节课`); loadSchedule(); }
      else alert(`❌ 导入失败:${d.error || res.status}`);
    } catch (e) {
      alert('导入出错:' + e.message);
    }
    pick.textContent = '选择文件';
    pick.disabled = false;
    fileInp.value = '';
  };
  row.appendChild(ownerInp);
  row.appendChild(pick);
  row.appendChild(el('span', 'live', '支持东北大学教务导出的 xlsx,自动识别节次/周次/教室'));
  up.appendChild(row);
  box.appendChild(up);

  if (!users.length) {
    const w = weather?.city ? `\n管理员已配置天气推送:${weather.city} 每天 ${weather.notifyTime}` : '';
    box.appendChild(el('div', 'card pre', `还没有学生提交课表。\n让学生给机器人私聊发送课表,或在上方直接上传课表文件。\n\n课表\n周一 08:00-09:40 高等数学 @一教101\n周一 10:00-11:40 大学英语 1-16周\n周二 14:00-15:40 物理实验 双周\n\n每天 21:00 机器人会私聊提醒学生第二天的课程。${w}`));
    return;
  }
  for (const u of users) {
    const card = el('div', 'card');
    const head = el('div', 's-head');
    head.appendChild(el('b', 'who', u.name || u.owner));
    const meta = [];
    if (u.semester_start) meta.push(`开学 ${u.semester_start}`);
    if (u.currentWeek) meta.push(`第${u.currentWeek}周`);
    meta.push(`提醒 ${u.notify_time || '21:00'}`);
    meta.push(u.push_kind ? `推送 ${u.push_kind === 'bark' ? 'Bark' : 'PushDeer'}` : '未绑推送');
    meta.push(`🍅今日 ${u.pomodoroToday || 0}`);
    head.appendChild(el('span', 'sub', `${u.owner} · ` + meta.join(' · ')));
    card.appendChild(head);

    const days = {};
    u.items.forEach((it) => { (days[it.day] ||= []).push(it); });
    for (const wd of [1, 2, 3, 4, 5, 6, 0]) {
      const arr = (days[wd] || []).slice().sort((a, b) => a.start_min - b.start_min);
      if (!arr.length) continue;
      const dl = el('div', 's-day');
      dl.appendChild(el('div', 's-dayname', WD[wd] + ` (${arr.length}节)`));
      for (const it of arr) {
        const row = el('div', 's-item');
        let label = `${fmtMin(it.start_min)}-${fmtMin(it.end_min)} ${it.name}`;
        if (it.location) label += ` @${it.location}`;
        row.appendChild(el('span', 't', label));
        const wl = [];
        if (it.week_start && it.week_end) wl.push(it.week_start === it.week_end ? `${it.week_start}周` : `${it.week_start}-${it.week_end}周`);
        if (it.parity === 'odd') wl.push('单周');
        if (it.parity === 'even') wl.push('双周');
        if (wl.length) row.appendChild(el('span', 's-week', wl.join(' ')));
        const del = el('button', 'del', '✕');
        del.title = '删除这节课';
        del.onclick = async () => {
          if (!confirm('删除这节课?')) return;
          await fetch(`/api/schedule/item/${it.id}`, { method: 'DELETE' });
          loadSchedule();
        };
        row.appendChild(del);
        dl.appendChild(row);
      }
      card.appendChild(dl);
    }

    const actions = el('div', 's-actions');
    const clearBtn = el('button', 'mini-btn', '清空该学生课表');
    clearBtn.onclick = async () => {
      if (!confirm(`确定清空「${u.name || u.owner}」的课表?`)) return;
      await fetch(`/api/schedule/${encodeURIComponent(u.owner)}`, { method: 'DELETE' });
      loadSchedule();
    };
    actions.appendChild(clearBtn);
    card.appendChild(actions);
    box.appendChild(card);
  }
}
</script>
